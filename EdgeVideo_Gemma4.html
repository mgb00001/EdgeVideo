              <div style={{fontSize:10,fontFamily:C.mono,color:C.amber,marginBottom:8,display:'flex',alignItems:'center',gap:6}}>
                <TriangleAlert size={11}/>EdgeVideo Console is offline — automated export disabled
              </div>
              <div style={{fontSize:9,fontFamily:C.mono,color:C.textDim,marginBottom:8,lineHeight:1.6}}>
                Start the EdgeVideo Console from the Windows taskbar icon, or double-click <b>launch_EdgeVideo.bat</b>. The page will detect it within 30 seconds — or click RECHECK.
              </div>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                <button onClick={()=>{
                  fetch(`${SERVE_URL}/api/workspace/info`).then(r=>{if(r.ok)location.reload();}).catch(()=>{});
                }} style={{background:'transparent',border:`1px solid ${C.border}`,borderRadius:5,padding:'7px 12px',cursor:'pointer',color:C.textDim,fontSize:10,fontFamily:C.mono,display:'flex',alignItems:'center',gap:5}}>
                  <RefreshCw size={11}/>RECHECK
                </button>
              </div>
            </div>
            <Btn onClick={downloadScriptFallback} disabled={!canExport} style={{width:'100%',justifyContent:'center',padding:'10px 14px'}}>
              <Download size={14}/>OR DOWNLOAD EXPORT SCRIPT (.ps1)
            </Btn>
          </div>
        )}
        {timeline.length===0&&<div style={{...card,textAlign:'center',padding:32,color:C.textDim,fontSize:11}}>
          <Download size={28} color={C.textDim} style={{margin:'0 auto 12px'}}/>
          <div>Build your timeline first, then come back here to export</div>
        </div>}
      </>}
    </div>
  );
}


// ── ModArchive ────────────────────────────────────────────────────────────────
function ModArchive({serveOnline}){
  const C=useTheme();const secT=mkSecT(C),card=mkCard(C);
  const [sessions,setSessions]=useState([]);
  const [loading,setLoading]=useState(false);
  const [actionSid,setActionSid]=useState(null);
  const [saveMsg,setSaveMsg]=useState(null); // {sid,text,color}

  const refresh=useCallback(async()=>{
    if(!serveOnline)return;
    setLoading(true);
    try{
      const r=await fetch(`${SERVE_URL}/api/session/list`);
      const d=await r.json();
      setSessions(d.sessions||[]);
    }catch(e){console.warn('archive list failed',e);}
    finally{setLoading(false);}
  },[serveOnline]);

  useEffect(()=>{refresh();},[refresh]);

  const doPlay=async(sid)=>{
    setActionSid(sid);
    await fetch(`${SERVE_URL}/api/session/${sid}/play`,{method:'POST',body:''}).catch(()=>{});
    setActionSid(null);
  };
  const doSaveAs=(sid,name)=>{
    // Trigger a browser download — the browser's native Save dialog appears.
    // No Tkinter dialog bridge needed.
    const fname=(name||sid).replace(/\.mp4$/i,'')+'.mp4';
    const a=document.createElement('a');
    a.href=`${SERVE_URL}/api/session/${sid}/download`;
    a.download=fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setSaveMsg({sid,text:'Download started — check your browser downloads.',color:C.green});
    setTimeout(()=>setSaveMsg(m=>m&&m.sid===sid?null:m),4000);
  };
  const doDelete=async(sid)=>{
    if(!confirm(`Delete session ${sid}? This cannot be undone.`))return;
    setActionSid(sid);
    await fetch(`${SERVE_URL}/api/session/${sid}`,{method:'DELETE'}).catch(()=>{});
    setActionSid(null);
    setSessions(prev=>prev.filter(s=>s.id!==sid));
  };

  return(
    <div style={{animation:'fadeIn 0.2s ease'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
        <span style={secT}>EXPORT ARCHIVE</span>
        <button onClick={refresh} disabled={loading||!serveOnline} title="Refresh"
          style={{background:'transparent',border:`1px solid ${C.border}`,borderRadius:4,padding:'4px 8px',cursor:'pointer',color:C.textDim,display:'flex',alignItems:'center',gap:5}}>
          <RefreshCw size={11} style={{animation:loading?'spin 1s linear infinite':undefined}}/><span style={{fontSize:9,fontFamily:C.mono}}>REFRESH</span>
        </button>
      </div>

      {!serveOnline&&<div style={{...card,textAlign:'center',padding:32,color:C.amber}}>
        <Archive size={28} color={C.amber} style={{margin:'0 auto 12px'}}/>
        <div style={{fontSize:12}}>Start EdgeVideo Console to view saved compilations</div>
      </div>}

      {serveOnline&&sessions.length===0&&!loading&&<div style={{...card,textAlign:'center',padding:32,color:C.textDim}}>
        <Archive size={28} color={C.textDim} style={{margin:'0 auto 12px'}}/>
        <div style={{fontSize:12,color:C.textHi,marginBottom:6}}>No saved sessions yet</div>
        <div style={{fontSize:10}}>Completed exports will appear here</div>
      </div>}

      {sessions.map(sess=>(
        <div key={sess.id} style={{...card,marginBottom:12,display:'flex',gap:14,alignItems:'flex-start',padding:14,opacity:actionSid===sess.id?0.5:1}}>
          {/* Thumbnail */}
          <div style={{width:96,height:54,background:'#030810',borderRadius:5,overflow:'hidden',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',border:`1px solid ${C.border}`}}>
            {sess.hasThumbnail
              ?<img src={`${SERVE_URL}/api/session/${sess.id}/thumbnail?t=${Date.now()}`} style={{width:'100%',height:'100%',objectFit:'cover'}} onError={e=>{e.target.style.display='none';}}/>
              :<Video size={18} color={C.textDim}/>}
          </div>
          {/* Info */}
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:12,color:C.textHi,fontWeight:600,marginBottom:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{sess.projName||sess.id}</div>
            <div style={{fontSize:9,fontFamily:C.mono,color:C.textDim,marginBottom:6,display:'flex',gap:10,flexWrap:'wrap'}}>
              <span><Clock size={9} style={{display:'inline',marginRight:3}}/>{new Date(sess.created).toLocaleDateString()} {new Date(sess.created).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
              {sess.duration>0&&<span>⏱ {fmtTime(sess.duration)}</span>}
              {sess.clipCount>0&&<span>{sess.clipCount} clips</span>}
              {sess.quality&&<span>{sess.quality}</span>}
              {sess.outputSize>0&&<span>{(sess.outputSize/1e6).toFixed(1)} MB</span>}
            </div>
            <div style={{display:'flex',gap:7}}>
              {sess.hasOutput&&<>
                <button onClick={()=>doPlay(sess.id)} disabled={!!actionSid}
                  style={{background:C.accentBg,border:`1px solid ${C.accent}44`,borderRadius:4,padding:'4px 10px',cursor:'pointer',color:C.accent,fontSize:9,fontFamily:C.mono,display:'flex',alignItems:'center',gap:4}}>
                  <Play size={9}/>PLAY
                </button>
                <button onClick={()=>doSaveAs(sess.id,sess.projName)} disabled={!!actionSid}
                  style={{background:C.blueBg,border:`1px solid ${C.blue}44`,borderRadius:4,padding:'4px 10px',cursor:'pointer',color:C.blue,fontSize:9,fontFamily:C.mono,display:'flex',alignItems:'center',gap:4}}>
                  <Save size={9}/>SAVE AS…
                </button>
              </>}
              {!sess.hasOutput&&<Tag color={C.textDim} bg={C.surface}>NO OUTPUT</Tag>}
              <button onClick={()=>doDelete(sess.id)} disabled={!!actionSid}
                style={{background:C.redBg,border:`1px solid ${C.red}33`,borderRadius:4,padding:'4px 10px',cursor:'pointer',color:C.red,fontSize:9,fontFamily:C.mono,display:'flex',alignItems:'center',gap:4}}>
                <Trash2 size={9}/>DELETE
              </button>
            </div>
            {saveMsg&&saveMsg.sid===sess.id&&(
              <div style={{marginTop:6,fontSize:9,fontFamily:C.mono,color:saveMsg.color,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                {saveMsg.text}
              </div>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function EdgeVideo(){
  const[theme,setTheme]=useState(()=>localStorage.getItem('ev_theme')||'dark');
  const C=THEMES[theme];
  useEffect(()=>{localStorage.setItem('ev_theme',theme);document.body.style.background=C.bg;},[theme,C.bg]);

  const[mod,setMod]=useState('library');
  const[showSettings,setShowSettings]=useState(false);
  const[ollamaOk,setOllamaOk]=useState(null);
  const[comfyOk,setComfyOk]=useState(null);
  const[modelInfo,setModelInfo]=useState(null);
  const[apiKeyInput,setApiKeyInput]=useState('');
  const[ltxInput,setLtxInput]=useState(_ltxCkpt);
  const[t5Input,setT5Input]=useState(_t5Encoder);
  const[clips,setClips]=useState([]);
  const[snippets,setSnippets]=useState([]);
  const[timeline,setTimeline]=useState([]);
  const[activeClipId,setActiveClipId]=useState(null);
  const[audioUrl,setAudioUrl]=useState(null);
  const[audioName,setAudioName]=useState('');
  const[audioSwfSaved,setAudioSwfSaved]=useState(false);
  const[beats,setBeats]=useState(null);
  const[aiOut,setAiOut]=useState(null);
  const[aiLoad,setAiLoad]=useState(false);
  const[aiError,setAiError]=useState(null);
  const[inferSrc,setInferSrc]=useState(null);
  // GWF / SWF workspace
  const[serveOnline,setServeOnline]=useState(false);
  const[gwfPath,setGwfPath]=useState(null);
  const[sessDir,setSessDir]=useState(null);
  const[diskFreeGb,setDiskFreeGb]=useState(null);
  const[sessionId,setSessionId]=useState(null);
  const[swfPath,setSwfPath]=useState(null);
  const sessionIdRef=useRef(null);
  const swfPathRef=useRef(null);

  // Ollama health
  useEffect(()=>{
    let alive=true;
    async function check(){
      try{const r=await fetch(`${OLLAMA_URL}/api/tags`);if(!r.ok)throw new Error();
        const d=await r.json();const m=d.models?.find(x=>x.name===MODEL_ID||x.model===MODEL_ID);
        if(!m)throw new Error();if(!alive)return;setOllamaOk(true);
        setModelInfo(prev=>{const q=m.details?.quantization_level||'Q4_K_M',g=(m.size/1e9).toFixed(1);
          if(prev&&prev.quant===q&&prev.size_gb===g)return prev;return{quant:q,size_gb:g,tok_s:prev?.tok_s||null};});}
      catch{if(alive)setOllamaOk(false);}
    }
    // ComfyUI health
    async function checkComfy(){
      try{const r=await fetch(`${COMFY_URL}/system_stats`);if(alive)setComfyOk(r.ok);}
      catch{if(alive)setComfyOk(false);}
    }
    check();checkComfy();
    const iv1=setInterval(check,30000),iv2=setInterval(checkComfy,15000);
    return()=>{alive=false;clearInterval(iv1);clearInterval(iv2);};
  },[]);

  // Workspace info — fetch from serve.ps1 on mount, then re-check every 30s
  useEffect(()=>{
    let alive=true;
    function checkWorkspace(){
      // Use explicit .then/.catch chains — avoids Babel async-generator issues
      // with .finally() and bare catch{} in the same function
      var tid=setTimeout(function(){}, 2000); // placeholder; real abort below
      clearTimeout(tid);
      fetch(SERVE_URL+'/api/workspace/info')
        .then(function(r){
          if(!r.ok)throw new Error('not ok');
          return r.json();
        })
        .then(function(d){
          if(!alive)return;
          setServeOnline(true);
          setGwfPath(d.gwf||null);
          setSessDir(d.sessDir||null);
          // Load GWF library
          return fetch(SERVE_URL+'/api/library/list')
            .then(function(lr){return lr.json();})
            .then(function(ld){
              if(!ld.files||!ld.files.length||!alive)return;
              setClips(function(prev){
                var updated=prev.map(function(c){
                  if(c.gwfName)return c;
                  var match=ld.files.find(function(f){return f.name.replace(/\.[^.]+$/,'')===c.name;});
                  if(match)return Object.assign({},c,{gwfName:match.name,
                    url:SERVE_URL+'/api/library/serve?name='+encodeURIComponent(match.name),
                    duration:c.duration||match.duration||0});
                  return c;
                });
                var linked=new Set(updated.filter(function(c){return c.gwfName;}).map(function(c){return c.gwfName;}));
                var newFromGwf=ld.files
                  .filter(function(f){return !linked.has(f.name);})
                  .map(function(f){return{
                    id:uid(),gwfName:f.name,name:f.name.replace(/\.[^.]+$/,''),
                    url:SERVE_URL+'/api/library/serve?name='+encodeURIComponent(f.name),
                    duration:f.duration||0,thumbnail:null,analysis:null,analyzing:false
                  };});
                return updated.concat(newFromGwf).slice(0,6);
              });
            })
            .catch(function(){});
        })
        .catch(function(e){if(alive)setServeOnline(false);});
    }
    checkWorkspace();
    var iv=setInterval(checkWorkspace,30000);
    return function(){alive=false;clearInterval(iv);};
  },[]);

  // /api/status polling — disk free, service health (every 10s)
  useEffect(()=>{
    let alive=true;
    function pollStatus(){
      fetch(SERVE_URL+'/api/status')
        .then(function(r){return r.ok?r.json():null;})
        .then(function(d){
          if(!d||!alive)return;
          if(d.disk&&typeof d.disk.free_gb==='number')setDiskFreeGb(d.disk.free_gb);
        })
        .catch(function(){});
    }
    pollStatus();
    var iv=setInterval(pollStatus,10000);
    return function(){alive=false;clearInterval(iv);};
  },[]);

  // ensureSession: create once per app session, then reuse
  const ensureSession=useCallback(async()=>{
    if(sessionIdRef.current){return{sid:sessionIdRef.current,swf:swfPathRef.current};}
    const r=await fetch(`${SERVE_URL}/api/session/create`,{method:'POST',body:''});
    const d=await r.json();
    sessionIdRef.current=d.sessionId;
    swfPathRef.current=d.swfPath;
    setSessionId(d.sessionId);
    setSwfPath(d.swfPath);
    return{sid:d.sessionId,swf:d.swfPath};
  },[]);

  // Sync timeline when snippets change
  useEffect(()=>{
    setTimeline(prev=>{
      const existing=new Map(prev.map(t=>[t.snippetId,t]));
      return snippets.map(sn=>existing.get(sn.id)||{id:uid(),snippetId:sn.id,transition:{type:'cut',prompt:'',videoUrl:null,generating:false,status:null,error:null}});
    });
  },[snippets]);

  const onLoadFiles=useCallback(async(fileList)=>{
    const allowed=Math.max(0,6-clips.length);
    const files=Array.from(fileList).slice(0,allowed).filter(f=>f.type.startsWith('video/')||/\.(mp4|mov|webm|mkv|avi)$/i.test(f.name));
    if(!files.length)return;

    if(serveOnline){
      // Upload to GWF, then create clip with serve URL
      for(const file of files){
        const id=uid();
        const blobUrl=URL.createObjectURL(file);
        // Add placeholder immediately so user sees it
        setClips(prev=>[...prev,{id,gwfName:null,name:file.name.replace(/\.[^.]+$/,''),url:blobUrl,duration:0,thumbnail:null,analysis:null,analyzing:false,uploading:true}]);
        // Async upload
        try{
          const r=await fetch(`${SERVE_URL}/api/library/upload`,{
            method:'POST',
            headers:{'X-Filename':file.name,'Content-Type':file.type||'application/octet-stream'},
            body:file
          });
          const d=await r.json();
          URL.revokeObjectURL(blobUrl);
          const serveUrl=`${SERVE_URL}/api/library/serve?name=${encodeURIComponent(d.name)}`;
          setClips(prev=>prev.map(c=>c.id===id?{...c,gwfName:d.name,url:serveUrl,duration:d.duration||0,uploading:false}:c));
        }catch(e){
          // Upload failed — keep blob URL so user can still use the clip
          setClips(prev=>prev.map(c=>c.id===id?{...c,uploading:false}:c));
          console.warn('GWF upload failed, using blob URL:',e&&e.message||String(e));
        }
        if(!activeClipId)setActiveClipId(id);
      }
    }else{
      // Offline fallback — blob URLs only
      const newClips=files.map(file=>{
        const url=URL.createObjectURL(file);
        const id=uid();
        const vid=document.createElement('video');
        vid.preload='metadata';vid.src=url;
        vid.addEventListener('loadedmetadata',()=>{
          setClips(prev=>prev.map(c=>c.id===id?{...c,duration:vid.duration}:c));
        },{once:true});
        return{id,file,url,name:file.name.replace(/\.[^.]+$/,''),duration:0,thumbnail:null,analysis:null,analyzing:false};
      });
      setClips(prev=>[...prev,...newClips]);
      if(newClips.length&&!activeClipId)setActiveClipId(newClips[0].id);
    }
  },[clips.length,activeClipId,serveOnline]);

  const onRemoveClip=useCallback(async(clip)=>{
    if(clip.url?.startsWith('blob:'))URL.revokeObjectURL(clip.url);
    if(serveOnline&&clip.gwfName){
      fetch(`${SERVE_URL}/api/library/remove?name=${encodeURIComponent(clip.gwfName)}`,{method:'DELETE'}).catch(()=>{});
    }
    setClips(prev=>prev.filter(c=>c.id!==clip.id));
    if(activeClipId===clip.id){
      setActiveClipId(null);
      setSnippets(prev=>prev.filter(s=>s.clipId!==clip.id));
    }
  },[serveOnline,activeClipId]);

  const onAnalyzeClip=useCallback(async(clipId)=>{
    setClips(prev=>prev.map(c=>c.id===clipId?{...c,analyzing:true,analysisError:null}:c));
    try{
      const clip=clips.find(c=>c.id===clipId);if(!clip)throw new Error('clip not found');
      const vid=document.getElementById('ev-vid-'+clipId);
      if(!vid)throw new Error('video element not mounted');
      await new Promise((res,rej)=>{if(vid.readyState>=1)res();else{vid.addEventListener('loadedmetadata',res,{once:true});setTimeout(rej,5000);}});
      const dur=vid.duration||clip.duration;
      const times=[0.05,0.25,0.5,0.75,0.95].map(f=>f*dur);
      const frames=[];
      for(const t of times){try{frames.push(await extractFrameAsBase64(vid,t));}catch(_){}}
      if(!frames.length)throw new Error('Could not extract frames');
      const analysis=await analyzeClipWithGemma(frames);
      setClips(prev=>prev.map(c=>c.id===clipId?{...c,analysis,analyzing:false}:c));
    }catch(e){setClips(prev=>prev.map(c=>c.id===clipId?{...c,analyzing:false,analysisError:e.message}:c));setAiError(e.message);}
  },[clips]);

  const runAI=useCallback(async(sys,user,onDone)=>{
    setAiLoad(true);setAiOut(null);setAiError(null);setInferSrc(null);
    try{const res=await gemma4Call(sys,user,src=>setInferSrc(src));setAiOut(res);onDone?.(res);}
    catch(e){setAiError(e.message);}finally{setAiLoad(false);}
  },[]);

  const MODS=[{id:'library',ic:'Film',lb:'Library'},{id:'snippets',ic:'Scissors',lb:'Snippets'},
    {id:'timeline',ic:'Layers',lb:'Timeline'},{id:'effects',ic:'Wand',lb:'Effects'},
    {id:'audio',ic:'Music',lb:'Audio'},{id:'export',ic:'Download',lb:'Export'},
    {id:'archive',ic:'Archive',lb:'Archive'}];
  const S=useMemo(()=>({inp:mkInp(C),lbl:mkLbl(C)}),[C]);

  // Inspector panel content
  const renderInspector=()=>{
    if(mod==='library'){
      const ac=clips.find(c=>c.id===activeClipId);
      if(!ac)return<div style={{padding:16,fontSize:10,fontFamily:C.mono,color:C.textDim,textAlign:'center',paddingTop:40}}>Click a clip to inspect it</div>;
      return(<div style={{padding:12}}>
        <span style={mkSecT(C)}>CLIP INSPECTOR</span>
        {ac.thumbnail&&<img src={ac.thumbnail} style={{width:'100%',borderRadius:5,marginBottom:10}}/>}
        <div style={{fontSize:12,color:C.textHi,marginBottom:4,fontWeight:600}}>{ac.name}</div>
        <div style={{fontSize:10,fontFamily:C.mono,color:C.textDim,marginBottom:10}}>{fmtTime(ac.duration)} duration</div>
        {ac.analysis&&Object.entries(ac.analysis).filter(([k])=>k!=='raw').map(([k,v])=>(
          <div key={k} style={{marginBottom:8}}>
            <div style={{fontSize:8,fontFamily:C.mono,color:C.accent,letterSpacing:'0.1em',marginBottom:3}}>{k.toUpperCase().replace('_',' ')}</div>
            {Array.isArray(v)
              ?<div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{v.map((x,i)=><Tag key={i} color={k==='color_palette'?x:undefined}>{typeof x==='string'&&x.startsWith('#')?<span style={{display:'inline-block',width:10,height:10,background:x,borderRadius:2,verticalAlign:'middle',marginRight:4}}/>:null}{x}</Tag>)}</div>
              :<div style={{fontSize:10,color:C.text,lineHeight:1.6}}>{String(v)}</div>}
          </div>
        ))}
        {!ac.analysis&&<div style={{fontSize:10,color:C.textDim,textAlign:'center',paddingTop:20}}>Click AI button on clip to analyze with Gemma 4 vision</div>}
      </div>);
    }
    if(mod==='snippets'||mod==='timeline'){
      const total=snippets.reduce((s,sn)=>s+(sn.outPoint-sn.inPoint),0);
      return(<div style={{padding:12}}>
        <span style={mkSecT(C)}>COMPILATION STATUS</span>
        {[['Snippets',`${snippets.length} / 10`,C.textHi],['Total Duration',fmtTime(total),Math.abs(total-300)<30?C.green:C.amber],['Target Duration','5:00',C.textDim],['Remaining',fmtTime(Math.max(0,300-total)),total<300?C.accent:C.green]].map(([k,v,c])=>(
          <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:`1px solid ${C.border}`,fontSize:10,fontFamily:C.mono}}>
            <span style={{color:C.textDim}}>{k}</span><span style={{color:c}}>{v}</span>
          </div>
        ))}
        {snippets.length>0&&<div style={{marginTop:12}}>
          {snippets.map((sn,i)=><div key={sn.id} style={{fontSize:9,fontFamily:C.mono,color:C.textDim,padding:'3px 0',display:'flex',justifyContent:'space-between'}}>
            <span style={{color:C.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1,marginRight:8}}>{i+1}. {sn.label}</span>
            <span>{(sn.outPoint-sn.inPoint).toFixed(1)}s</span>
          </div>)}
        </div>}
      </div>);
    }
    if(mod==='effects'){
      const aiTotal=timeline.filter(t=>t.transition.type==='ltx-video').length;
      const aiDone=timeline.filter(t=>t.transition.type==='ltx-video'&&t.transition.videoUrl).length;
      const aiGen=timeline.filter(t=>t.transition.generating).length;
      return(<div style={{padding:12}}>
        <span style={mkSecT(C)}>COMFYUI STATUS</span>
        {[['ComfyUI',comfyOk?'Online':'Offline',comfyOk?C.green:C.red],['LTX-Video',comfyOk?'Ready':'Waiting',comfyOk?C.accent:C.textDim],['AI Transitions',`${aiDone}/${aiTotal}`,aiDone===aiTotal&&aiTotal>0?C.green:C.amber],['Generating',aiGen>0?`${aiGen} active`:'Idle',aiGen>0?C.amber:C.textDim]].map(([k,v,c])=>(
          <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:`1px solid ${C.border}`,fontSize:10,fontFamily:C.mono}}>
            <span style={{color:C.textDim}}>{k}</span><span style={{color:c}}>{v}</span>
          </div>
        ))}
        {aiLoad&&<div style={{marginTop:12,fontSize:10,fontFamily:C.mono,color:C.accent,display:'flex',gap:6,alignItems:'center'}}>
          <Loader size={10} style={{animation:'spin 1s linear infinite'}}/>Gemma 4 running...
        </div>}
        {aiError&&<div style={{background:C.redBg,border:`1px solid ${C.red}33`,borderRadius:4,padding:'6px 8px',fontSize:10,fontFamily:C.mono,color:C.red,marginTop:10}}>⚠ {aiError}</div>}
      </div>);
    }
    // Default: AI output
    return(<div style={{padding:12}}>
      <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:10}}>
        <Sparkles size={12} color={C.accent}/>
        <span style={{fontSize:9,fontFamily:C.mono,color:C.accent,letterSpacing:'0.12em'}}>GEMMA 4 OUTPUT</span>
        {aiLoad&&<div style={{marginLeft:'auto',width:7,height:7,borderRadius:'50%',background:C.accent,animation:'pulse 1s infinite'}}/>}
      </div>
      {aiLoad&&<div style={{textAlign:'center',paddingTop:20}}><Loader size={18} color={C.accent} style={{animation:'spin 1s linear infinite',display:'block',margin:'0 auto 8px'}}/><div style={{fontSize:10,fontFamily:C.mono,color:C.textDim}}>INFERRING...</div></div>}
      {aiError&&<div style={{background:C.redBg,border:`1px solid ${C.red}33`,borderRadius:4,padding:'8px',fontSize:10,fontFamily:C.mono,color:C.red}}>⚠ {aiError}</div>}
      {!aiLoad&&aiOut&&<pre style={{fontSize:9,fontFamily:C.mono,color:C.text,whiteSpace:'pre-wrap',wordBreak:'break-word',lineHeight:1.7}}>{aiOut}</pre>}
      {!aiLoad&&!aiOut&&!aiError&&<div style={{fontSize:10,fontFamily:C.mono,color:C.textDim,textAlign:'center',paddingTop:40,lineHeight:2}}>AI output<br/>appears here</div>}
    </div>);
  };

  const renderMod=()=>{
    switch(mod){
      case'library':return<ModLibrary clips={clips} onLoadFiles={onLoadFiles} onAnalyzeClip={onAnalyzeClip} onRemoveClip={onRemoveClip} activeClipId={activeClipId} setActiveClipId={setActiveClipId} setMod={setMod} gwfPath={gwfPath} serveOnline={serveOnline}/>;
      case'snippets':return<ModSnippets clips={clips} activeClipId={activeClipId} setActiveClipId={setActiveClipId} snippets={snippets} setSnippets={setSnippets} setMod={setMod}/>;
      case'timeline':return<ModTimeline snippets={snippets} timeline={timeline} setTimeline={setTimeline} setMod={setMod}/>;
      case'effects':return<ModEffects timeline={timeline} setTimeline={setTimeline} snippets={snippets} clips={clips} comfyOk={comfyOk} setComfyOk={setComfyOk} ollamaOk={ollamaOk} onEnsureSession={serveOnline?ensureSession:null}/>;
      case'audio':return<ModAudio audioUrl={audioUrl} setAudioUrl={setAudioUrl} audioName={audioName} setAudioName={setAudioName} onEnsureSession={serveOnline?ensureSession:null} audioSwfSaved={audioSwfSaved} setAudioSwfSaved={setAudioSwfSaved}/>;
      case'export':return<ModExport clips={clips} snippets={snippets} timeline={timeline} audioUrl={audioUrl} audioName={audioName} audioSwfSaved={audioSwfSaved} gwfPath={gwfPath} swfPath={swfPath} sessionId={sessionId} onEnsureSession={serveOnline?ensureSession:null} serveOnline={serveOnline} diskFreeGb={diskFreeGb}/>;
      case'archive':return<ModArchive serveOnline={serveOnline}/>;
      default:return null;
    }
  };

  return(
    <ThemeCtx.Provider value={C}>
    <div style={{background:C.bg,borderRadius:10,overflow:'hidden',border:`1px solid ${C.border}`,display:'flex',flexDirection:'column',minHeight:780,fontFamily:C.sans,color:C.text}}>
      {/* Header */}
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:'0 14px',height:44,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{fontFamily:C.mono,fontSize:14,fontWeight:700,letterSpacing:'0.18em'}}><span style={{color:C.accent}}>EDGE</span><span style={{color:C.textHi}}>VIDEO</span></div>
          <Tag>COMPILATION STUDIO</Tag>
          <Tag color={ollamaOk?C.green:ollamaOk===false?C.red:C.amber} bg={ollamaOk?C.greenBg:ollamaOk===false?C.redBg:C.amberBg}>{ollamaOk===null?'CHECKING':ollamaOk?'GEMMA 4 LIVE':'OLLAMA OFFLINE'}</Tag>
          <Tag color={comfyOk?C.green:comfyOk===false?C.red:C.amber} bg={comfyOk?C.greenBg:comfyOk===false?C.redBg:C.amberBg}>{comfyOk===null?'...':comfyOk?'COMFYUI LIVE':'COMFYUI OFFLINE'}</Tag>
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          {[{id:'dark',label:'🌙'},{id:'light',label:'☀'},{id:'highvis',label:'⚡'}].map(t=>(
            <button key={t.id} onClick={()=>setTheme(t.id)} style={{background:theme===t.id?C.accent:'transparent',color:theme===t.id?C.bg:C.textDim,border:`1px solid ${theme===t.id?C.accent:C.border}`,borderRadius:4,padding:'3px 8px',cursor:'pointer',fontSize:12}}>{t.label}</button>
          ))}
          <div style={{width:1,height:20,background:C.border,margin:'0 2px'}}/>
          <button onClick={()=>setShowSettings(s=>!s)} style={{background:showSettings?C.accentBg:'transparent',border:`1px solid ${showSettings?C.accent:C.border}`,borderRadius:4,padding:'4px 8px',cursor:'pointer',display:'flex',alignItems:'center',gap:5}}>
            <Settings size={12} color={showSettings?C.accent:C.textDim}/>
            <span style={{fontSize:9,fontFamily:C.mono,color:showSettings?C.accent:C.textDim}}>SETTINGS</span>
          </button>
        </div>
      </div>
      {/* Settings */}
      {showSettings&&<div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:'12px 18px',display:'flex',gap:20,alignItems:'flex-end',animation:'fadeIn 0.15s ease'}}>
        <div style={{flex:1}}>
          <label style={S.lbl}>Ollama — Gemma 4 E4B</label>
          <input readOnly value={`${OLLAMA_URL}  |  ${MODEL_ID}  |  ${ollamaOk?(modelInfo?.quant||'')+'  '+(modelInfo?.size_gb||'')+'GB':'OFFLINE'}`} style={{...S.inp,color:ollamaOk?C.green:C.red,fontFamily:C.mono,fontSize:10}}/>
        </div>
        <div style={{flex:1}}>
          <label style={S.lbl}>ComfyUI endpoint</label>
          <div style={{display:'flex',gap:8}}>
            <input readOnly value={`${COMFY_URL}  |  ${comfyOk?'Connected':'Offline'}`} style={{...S.inp,color:comfyOk?C.green:C.red,fontFamily:C.mono,fontSize:10,flex:1}}/>
            <RestartComfyBtn setComfyOk={setComfyOk}/>

          <div style={{display:'flex',gap:8}}>

          </div>
        </div>

      {/* Body */}
      <div style={{display:'flex',flex:1,overflow:'hidden'}}>
        {/* Sidebar */}
        <div style={{width:70,background:C.surface,borderRight:`1px solid ${C.border}`,display:'flex',flexDirection:'column',alignItems:'center',padding:'8px 0',gap:2,flexShrink:0}}>
          {MODS.map(({id,ic,lb})=>(
            <button key={id} onClick={()=>setMod(id)} style={{width:'100%',background:mod===id?C.panel:'transparent',border:'none',borderLeft:`2px solid ${mod===id?C.accent:'transparent'}`,color:mod===id?C.accent:C.textDim,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',padding:'10px 0',gap:4}}>
              <SafeIcon name={ic} size={17}/><span style={{fontSize:8,fontFamily:C.mono,letterSpacing:'0.08em'}}>{lb.toUpperCase()}</span>
            </button>
          ))}
          <div style={{marginTop:'auto',padding:'8px 0',display:'flex',flexDirection:'column',alignItems:'center',gap:5}}>

              <div key={lbl} style={{background:ok?C.greenBg:ok===false?C.redBg:C.amberBg,border:`1px solid ${ok?C.green:ok===false?C.red:C.amber}44`,borderRadius:4,padding:'3px 4px',width:46,textAlign:'center'}}>
                <div style={{fontSize:7,fontFamily:C.mono,color:ok?C.green:ok===false?C.red:C.amber}}>{lbl}</div>
                <div style={{fontSize:7,fontFamily:C.mono,color:ok?C.green:ok===false?C.red:C.amber,opacity:0.7}}>{ok===null?'...':ok?'LIVE':'OFF'}</div>
              </div>

          </div>
        </div>
        {/* Module */}
        <div style={{flex:1,padding:18,overflowY:'auto',minWidth:0}}>{renderMod()}</div>
        {/* Inspector */}

          {renderInspector()}

      {/* Status bar */}
      <div style={{background:C.surface,borderTop:`1px solid ${C.border}`,height:36,display:'flex',alignItems:'center',padding:'0 14px',gap:16,flexShrink:0,fontSize:9,fontFamily:C.mono,color:C.textDim}}>
        <span><span style={{color:C.accent}}>{clips.length}</span> clips</span>
        <span><span style={{color:C.accent}}>{snippets.length}</span>/10 snippets</span>
        <span><span style={{color:C.accent}}>{timeline.length}</span> in timeline</span>
        <span><span style={{color:C.accent}}>{timeline.filter(t=>t.transition.type==='ltx-video'&&t.transition.videoUrl).length}</span> AI transitions done</span>
        <span style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:6,height:6,borderRadius:'50%',background:serveOnline?C.green:C.textDim}}/>
          <span style={{color:serveOnline?C.green:C.textDim,fontFamily:C.mono,fontSize:9}}>{serveOnline?'SERVER':'OFFLINE'}</span>
          <span style={{color:C.textDim}}>  EdgeVideo v3.0  Gemma 4 + LTX-Video</span>
        </span>
      </div>
    </div>
    </ThemeCtx.Provider>
  );
}
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  componentDidCatch(e,info){const b=document.getElementById('ev-err');if(b){b.style.display='block';b.innerHTML='<h2>REACT RENDER ERROR</h2><pre>'+(e?.stack||e?.message||e)+'\n\nComponent trace:\n'+(info?.componentStack||'--')+'</pre>';}}
  render(){return this.state.err?null:this.props.children;}
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(ErrorBoundary,null,React.createElement(EdgeVideo)));
</script>
