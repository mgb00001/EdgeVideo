// ── Frame extraction ──────────────────────────────────────────────────────────
async function extractFrameAsBase64(videoEl,timeS,w=320){
  return new Promise((resolve,reject)=>{
    const t=setTimeout(()=>{videoEl.removeEventListener('seeked',onS);reject(new Error('seek timeout'));},6000);
    function onS(){
      clearTimeout(t);videoEl.removeEventListener('seeked',onS);
      const h=Math.round(w*videoEl.videoHeight/Math.max(1,videoEl.videoWidth));
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(videoEl,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',0.8).split(',')[1]);
    }
    videoEl.addEventListener('seeked',onS,{once:true});
    videoEl.currentTime=Math.max(0,Math.min(timeS,(videoEl.duration||0)-0.01));
  });
}

// ── Frame extraction from blob URL (no DOM video element required) ───────────
async function extractFrameFromUrl(url,timeS,w=512){
  return new Promise((resolve,reject)=>{
    const vid=document.createElement('video');
    vid.preload='auto';vid.muted=true;vid.crossOrigin='anonymous';
    const bail=setTimeout(()=>{vid.src='';reject(new Error('Frame extract timeout'));},15000);
    const doSeek=()=>{
      const t2=setTimeout(()=>{clearTimeout(bail);vid.src='';reject(new Error('Seek timeout'));},8000);
      vid.addEventListener('seeked',()=>{
        clearTimeout(t2);clearTimeout(bail);
        const h=Math.round(w*vid.videoHeight/Math.max(1,vid.videoWidth));
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(vid,0,0,w,h);
        vid.src='';
        resolve(cv.toDataURL('image/jpeg',0.85).split(',')[1]);
      },{once:true});
      vid.currentTime=Math.max(0,timeS);
    };
    vid.addEventListener('loadedmetadata',doSeek,{once:true});
    vid.addEventListener('error',()=>{clearTimeout(bail);reject(new Error('Video load error'));},{once:true});
    vid.src=url;
  });
}

// ── Gemma 4 multimodal clip analysis ─────────────────────────────────────────

// Salvage individual fields from a truncated (no closing }) JSON string.
function _salvagePartialJson(txt){
  const out={};
  for(const f of ['subject','action','setting','mood','suggested_label','editing_notes','pacing']){
    const m=txt.match(new RegExp('"'+f+'"\\s*:\\s*"([^"]*)"'));
    if(m)out[f]=m[1];
  }
  const cp=txt.match(/"color_palette"\s*:\s*\[([^\]]*)/);
  if(cp){
    const cols=[...cp[1].matchAll(/"(#[0-9a-fA-F]{3,8})"/g)].map(m=>m[1]);
    if(cols.length)out.color_palette=cols;
  }
  return Object.keys(out).length>=3?out:null;
}

async function analyzeClipWithGemma(frames){
  const r=await fetch(`${OLLAMA_URL}/api/chat`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:MODEL_ID,stream:false,options:{temperature:0.3,num_predict:1024},
      messages:[{role:'user',
        content:'Analyze these video frames. Return ONLY a raw JSON object — no markdown, no explanation, no code fences. Keep all string values under 8 words. Example: {"subject":"live band on stage","action":"playing instruments","setting":"dark indoor venue","mood":"energetic","color_palette":["#1a1a2e","#e94560","#f5a623"],"suggested_label":"band performance","editing_notes":"cut on beat drops","pacing":"fast"}',
        images:frames}]})});
  if(!r.ok)throw new Error(`Ollama ${r.status} — is Gemma 4 running? (ollama run gemma4:e4b)`);
  const d=await r.json();
  const txt=(d.message?.content||'').trim();
  if(!txt)throw new Error('Gemma returned an empty response');
  // Strip markdown fences then find the outermost { } block
  const stripped=txt.replace(/```json\n?|```/g,'').trim();
  const start=stripped.indexOf('{');
  const end=stripped.lastIndexOf('}');
  if(start!==-1&&end>start){
    try{return JSON.parse(stripped.slice(start,end+1));}catch(_){}
  }
  // Truncated response — no closing brace. Try to salvage whatever fields were written.
  if(start!==-1){
    const partial=_salvagePartialJson(stripped.slice(start));
    if(partial)return partial;
  }
  throw new Error(`Gemma response could not be parsed as JSON. Raw: ${txt.slice(0,120)}`);
}

// ── Gemma 4 text call ─────────────────────────────────────────────────────────
async function gemma4Call(sys,user,onSource){
  try{
    const r=await fetch(`${OLLAMA_URL}/api/chat`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:MODEL_ID,stream:false,options:{temperature:0.7,num_predict:1024},
        messages:[{role:'system',content:sys},{role:'user',content:user}]})});
    if(r.ok){const d=await r.json();onSource?.('local');return d.message?.content||'';}
    throw new Error(`Ollama HTTP ${r.status}`);
  }catch(err){
    const key=getAnthropicKey();if(!key)throw new Error(`Ollama unavailable: ${err.message}. No API key set.`);
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1024,
        system:sys,messages:[{role:'user',content:user}]})});
    const d=await r.json();if(!r.ok)throw new Error(d.error?.message||`Anthropic ${r.status}`);
    onSource?.('cloud');return d.content?.[0]?.text||'';
  }
}

// ── ComfyUI ───────────────────────────────────────────────────────────────────
let _t5Encoder='t5xxl_fp8_e4m3fn.safetensors'; // T5-XXL fp8 — loaded separately from video model
// startFrame: ComfyUI filename from uploadFrameToComfy, or null for pure text-to-video
function buildLTXWorkflow(prompt,width=512,height=288,frames=49,startFrame=null){
  // LTX-Video 2b v0.9.1 workflow — current ComfyUI node names
  // Model file has no bundled text encoder → CLIPLoader (type=ltxv) loads T5-XXL separately
  // Width/height must be divisible by 32. Frames must be 8N+1 (25,33,41,49,57,65,73,97)
  // RTX 4070 Laptop 8GB: DynamicVRAM swaps T5-XXL and video model between GPU/RAM automatically
  // startFrame: when provided adds LoadImage → ImageScale → VAEEncode → guiding_latent (I2V)
  const neg='worst quality, inconsistent motion, blurry, jittery, distorted, watermark';
  const seed=Math.floor(Math.random()*2**31);
  const base={
    // Step 0: Load T5-XXL text encoder (fp8, ~4.7GB — DynamicVRAM will swap to CPU after encoding)
    '0':{class_type:'CLIPLoader',inputs:{clip_name:_t5Encoder,type:'ltxv'}},
    // Step 1: Load video model (MODEL[0]) + VAE (VAE[2]) — no CLIP bundled in this checkpoint
    '1':{class_type:'CheckpointLoaderSimple',inputs:{ckpt_name:_ltxCkpt}},
    // Step 2-3: Encode positive/negative prompts using T5-XXL
    '2':{class_type:'CLIPTextEncode',inputs:{clip:['0',0],text:prompt}},
    '3':{class_type:'CLIPTextEncode',inputs:{clip:['0',0],text:neg}},
    // Step 4: Attach frame_rate metadata to conditioning (required for LTX-Video sampling)
    // guiding_latent wired in below when startFrame is provided
    '4':{class_type:'LTXVConditioning',inputs:{positive:['2',0],negative:['3',0],frame_rate:24}},
    // Step 5: Create empty latent video tensor
    '5':{class_type:'EmptyLTXVLatentVideo',inputs:{width,height,length:frames,batch_size:1}},
    // Step 6: Patch model sampling for LTX-Video's flow-matching schedule
    '6':{class_type:'ModelSamplingLTXV',inputs:{model:['1',0],max_shift:2.05,base_shift:0.95,latent:['5',0]}},
    // Step 7: Build LTXV sigmas (stretch=true maps to [terminal, 1] range for flow matching)
    '7':{class_type:'LTXVScheduler',inputs:{steps:25,max_shift:2.05,base_shift:0.95,stretch:true,terminal:0.1,latent:['5',0]}},
    // Step 8: Euler sampler (recommended for LTX-Video)
    '8':{class_type:'KSamplerSelect',inputs:{sampler_name:'euler'}},
    // Step 9: Random noise seed
    '9':{class_type:'RandomNoise',inputs:{noise_seed:seed}},
    // Step 10: CFG guider — cfg=3 is the sweet spot for LTX-Video 2b
    '10':{class_type:'CFGGuider',inputs:{model:['6',0],positive:['4',0],negative:['4',1],cfg:3.0}},
    // Step 11: Run diffusion — denoised_output[1] is the final clean result
    '11':{class_type:'SamplerCustomAdvanced',inputs:{noise:['9',0],guider:['10',0],sampler:['8',0],sigmas:['7',0],latent_image:['5',0]}},
    // Step 12: Decode latent → image frame batch
    '12':{class_type:'VAEDecode',inputs:{vae:['1',2],samples:['11',1]}},
    // Step 13: Combine frames → H.264 MP4 (uses ffmpeg via VHS)
    '13':{class_type:'VHS_VideoCombine',inputs:{images:['12',0],frame_rate:24,loop_count:0,
      filename_prefix:'EdgeVideo_tr',format:'video/h264-mp4',pingpong:false,save_output:true,
      pix_fmt:'yuv420p',crf:19,save_metadata:true,trim_to_audio:false}}
  };
  if(startFrame){
    // I2V conditioning: LoadImage → ImageScale (match output dims) → VAEEncode → guiding_latent
    // Node IDs 14/15/16 are safe — not used by base workflow
    base['14']={class_type:'LoadImage',inputs:{image:startFrame,upload:'image'}};
    base['16']={class_type:'ImageScale',inputs:{image:['14',0],width,height,upscale_method:'lanczos',crop:'center'}};
    base['15']={class_type:'VAEEncode',inputs:{pixels:['16',0],vae:['1',2]}};
    // Wire guiding_latent into LTXVConditioning so the model anchors to this frame
    base['4'].inputs.guiding_latent=['15',0];
  }
  return base;
}
async function comfySubmit(workflow,onProgress){
  const sub=await fetch(`${COMFY_URL}/prompt`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({prompt:workflow,client_id:'edgevideo'})});
  if(!sub.ok)throw new Error(`ComfyUI submit failed: ${sub.status}`);
  const {prompt_id}=await sub.json();
  onProgress?.('Queued — waiting for ComfyUI...');
  const filename=await new Promise((resolve,reject)=>{
    const iv=setInterval(async()=>{
      try{
        const h=await fetch(`${COMFY_URL}/history/${prompt_id}`);
        const data=await h.json();
        const job=data[prompt_id];
        if(!job)return;
        if(job.status?.status_str==='error'){clearInterval(iv);reject(new Error('ComfyUI job errored'));return;}
        if(job.status?.status_str==='success'||job.outputs){
          const out=job.outputs?.['13']?.videos||job.outputs?.['13']?.gifs||job.outputs?.['6']?.videos||job.outputs?.['6']?.gifs;
          if(out?.[0]?.filename){clearInterval(iv);resolve(out[0].filename);}
          else{
            // fallback scan
            for(const k of Object.keys(job.outputs||{})){
              const v=job.outputs[k].videos||job.outputs[k].gifs;
              if(v?.[0]?.filename){clearInterval(iv);resolve(v[0].filename);return;}
            }
          }
        }
        const q=job.status?.messages;if(q)onProgress?.(`Running…`);
      }catch(_){}
    },1500);
    setTimeout(()=>{clearInterval(iv);reject(new Error('ComfyUI timed out (3 min)'));},180000);
  });
  const view=await fetch(`${COMFY_URL}/view?filename=${encodeURIComponent(filename)}&type=output`);
  if(!view.ok)throw new Error(`ComfyUI /view failed: ${view.status}`);
  return URL.createObjectURL(await view.blob());
}

// ── Upload a JPEG frame to ComfyUI /upload/image, return server filename ──────
async function uploadFrameToComfy(base64Jpeg){
  const bin=atob(base64Jpeg);
  const buf=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
  const blob=new Blob([buf],{type:'image/jpeg'});
  const form=new FormData();
  form.append('image',blob,`ev_frame_${Date.now()}.jpg`);
  form.append('type','input');form.append('overwrite','true');
  const r=await fetch(`${COMFY_URL}/upload/image`,{method:'POST',body:form});
  if(!r.ok)throw new Error(`ComfyUI upload failed: ${r.status}`);
  const {name}=await r.json();
  return name; // e.g. "ev_frame_1234567890.jpg"
}

// ── ClipCard ──────────────────────────────────────────────────────────────────
function ClipCard({clip,active,onSelect,onAnalyze,onRemove}){
  const C=useTheme();
  const vidRef=useRef(null);
  const [thumbData,setThumbData]=useState(clip.thumbnail);

  useEffect(()=>{
    if(thumbData||!vidRef.current)return;
    const vid=vidRef.current;
    const onMeta=async()=>{
      try{const b64=await extractFrameAsBase64(vid,vid.duration*0.1);setThumbData('data:image/jpeg;base64,'+b64);}catch(_){}
    };
    if(vid.readyState>=1)onMeta();else vid.addEventListener('loadedmetadata',onMeta,{once:true});
  },[]);

  return(
    <div onClick={onSelect} style={{cursor:'pointer',borderRadius:8,overflow:'hidden',
      border:`2px solid ${active?C.accent:C.border}`,background:C.panel,
      transition:'border-color 0.15s',animation:'fadeIn 0.2s ease'}}>
      {/* Hidden video for frame extraction */}
      <video ref={vidRef} id={'ev-vid-'+clip.id} src={clip.url} preload="metadata" muted
        style={{display:'none'}} onLoadedMetadata={e=>{/* duration set in parent via handler */}}/>
      {/* Thumbnail */}
      <div style={{aspectRatio:'16/9',background:'#030810',position:'relative',overflow:'hidden'}}>
        {thumbData
          ?<img src={thumbData} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
          :<div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <Film size={22} color={C.textDim}/>
          </div>}
        {clip.analyzing&&<div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.6)',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
          <Loader size={14} color={C.accent} style={{animation:'spin 1s linear infinite'}}/>
          <span style={{fontSize:9,fontFamily:C.mono,color:C.accent}}>ANALYZING</span>
        </div>}
        {clip.duration>0&&<div style={{position:'absolute',bottom:4,right:6,background:'rgba(0,0,0,0.7)',borderRadius:3,padding:'1px 6px',fontSize:9,fontFamily:C.mono,color:'#fff'}}>{fmtTime(clip.duration)}</div>}
        {clip.analysis&&<div style={{position:'absolute',top:4,left:4}}><Tag color={C.green} bg={C.greenBg}>AI</Tag></div>}
      </div>
      {/* Info bar */}
      <div style={{padding:'8px 10px',display:'flex',alignItems:'center',gap:8}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:11,color:C.textHi,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{clip.analysis?.suggested_label||clip.name}</div>
          <div style={{fontSize:9,fontFamily:C.mono,color:clip.analysisError?C.red:C.textDim,marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}
            title={clip.analysisError||undefined}>
            {clip.analysis?.mood||clip.analysis?.setting||clip.analysis?.subject
              ||(clip.analysisError?'Analysis failed — hover for detail':'Not yet analyzed')}
          </div>
        </div>
        <button onClick={e=>{e.stopPropagation();onAnalyze();}} disabled={clip.analyzing}
          title="Analyze with Gemma 4 vision"

// ── SnippetEditor ─────────────────────────────────────────────────────────────
function SnippetEditor({clip,snippets,setSnippets}){
  const C=useTheme();const inp=mkInp(C);
  const vidRef=useRef(null);
  const [duration,setDuration]=useState(0);
  const [currentTime,setCurrentTime]=useState(0);
  const [inPt,setInPt]=useState(0);
  const [outPt,setOutPt]=useState(30);
  const [playing,setPlaying]=useState(false);
  const [label,setLabel]=useState('');

  useEffect(()=>{
    const vid=vidRef.current;if(!vid)return;
    vid.src=clip.url;
    const onMeta=()=>{const d=vid.duration;setDuration(d);setInPt(0);setOutPt(Math.min(30,d));};
    const onTime=()=>setCurrentTime(vid.currentTime);
    vid.addEventListener('loadedmetadata',onMeta);
    vid.addEventListener('timeupdate',onTime);
    if(vid.readyState>=1)onMeta();
    return()=>{vid.removeEventListener('loadedmetadata',onMeta);vid.removeEventListener('timeupdate',onTime);};
  },[clip.url]);

  // Loop playback within in/out window
  useEffect(()=>{
    const vid=vidRef.current;if(!vid)return;
    const check=()=>{if(vid.currentTime>outPt)vid.currentTime=inPt;};
    vid.addEventListener('timeupdate',check);
    return()=>vid.removeEventListener('timeupdate',check);
  },[inPt,outPt]);

  const seekTo=t=>{if(vidRef.current)vidRef.current.currentTime=t;};

  const updateIn=v=>{const n=parseFloat(v);setInPt(n);if(outPt-n>30)setOutPt(Math.min(n+30,duration));seekTo(n);};
  const updateOut=v=>{const n=parseFloat(v);setOutPt(n);if(n-inPt>30)setInPt(Math.max(0,n-30));seekTo(n);};

  const addSnippet=useCallback(async()=>{
    if(snippets.length>=10)return;
    const vid=vidRef.current;
    let thumb='';
    try{const b64=await extractFrameAsBase64(vid,inPt);thumb='data:image/jpeg;base64,'+b64;}catch(_){}
    setSnippets(prev=>[...prev,{
      id:uid(),clipId:clip.id,clipName:clip.analysis?.suggested_label||clip.name,
      inPoint:inPt,outPoint:outPt,label:label||(clip.analysis?.suggested_label||clip.name),thumbnail:thumb
    }]);
    setLabel('');
  },[clip,inPt,outPt,label,snippets.length,setSnippets]);

  const selDur=+(outPt-inPt).toFixed(2);
  const card=mkCard(C);
  return(
    <div>
      {/* Video player */}
      <div style={{aspectRatio:'16/9',background:'#030810',borderRadius:8,overflow:'hidden',marginBottom:10,position:'relative'}}>
        <video ref={vidRef} style={{width:'100%',height:'100%',objectFit:'contain'}}
          onPlay={()=>setPlaying(true)} onPause={()=>setPlaying(false)}/>
        {/* Caption overlays — shows any snippet caption whose window includes currentTime */}
        {duration>0&&snippets
          .filter(s=>s.clipId===clip.id&&s.caption?.enabled&&s.caption?.text)
          .map(s=>{
            const cap=s.caption;
            const absStart=s.inPoint+(cap.startTime??2);
            const absEnd=absStart+(cap.duration??3);
            if(currentTime<absStart||currentTime>absEnd)return null;
            return(
              <div key={s.id} style={{position:'absolute',bottom:'10%',left:0,right:0,
                display:'flex',justifyContent:'center',pointerEvents:'none'}}>
                <span style={{
                  fontSize:cap.fontSize??32,color:'#fff',fontWeight:700,
                  fontFamily:'Arial,Helvetica,sans-serif',textAlign:'center',
                  textShadow:'0 2px 10px rgba(0,0,0,0.95),0 0 20px rgba(0,0,0,0.7)',
                  background:'rgba(0,0,0,0.45)',padding:'3px 16px',borderRadius:5,
                  maxWidth:'85%',wordBreak:'break-word',lineHeight:1.25,
                  display:'inline-block'}}>
                  {cap.text}
                </span>
              </div>
            );
          })
        }
        {/* In/out markers overlaid */}
        {duration>0&&<>
          <div style={{position:'absolute',bottom:0,left:0,right:0,height:4,background:'rgba(0,0,0,0.4)'}}>
            <div style={{position:'absolute',left:`${inPt/duration*100}%`,width:`${(outPt-inPt)/duration*100}%`,height:'100%',background:`${C.accent}88`}}/>
            <div style={{position:'absolute',left:`${currentTime/duration*100}%`,width:2,height:'100%',background:C.accent}}/>
          </div>
        </>}
      </div>
      {/* Controls */}
      <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:12}}>
        <button style={{background:C.accentBg,border:`1px solid ${C.accent}44`,borderRadius:4,padding:'5px 10px',cursor:'pointer',color:C.accent,display:'flex',alignItems:'center',gap:5}}
          onClick={()=>{const v=vidRef.current;if(!v)return;v.currentTime=inPt;playing?v.pause():v.play();}}>
          {playing?<Pause size={12}/>:<Play size={12}/>}
        </button>
        <button style={{background:'transparent',border:`1px solid ${C.border}`,borderRadius:4,padding:'5px 8px',cursor:'pointer',color:C.textDim}}
          onClick={()=>{const v=vidRef.current;if(!v)return;v.pause();v.currentTime=inPt;}}>
          <Square size={11}/>
        </button>
        <div style={{flex:1,height:6,background:C.border,borderRadius:3,position:'relative',cursor:'pointer'}}
          onClick={e=>{if(!duration)return;const r=e.currentTarget.getBoundingClientRect();seekTo((e.clientX-r.left)/r.width*duration);}}>
          <div style={{position:'absolute',left:`${inPt/duration*100}%`,width:`${(outPt-inPt)/duration*100}%`,height:'100%',background:`${C.accent}55`,borderRadius:3}}/>
          <div style={{position:'absolute',left:`${currentTime/duration*100}%`,width:2,height:'100%',background:C.accent,top:0}}/>
        </div>
        <span style={{fontSize:9,fontFamily:C.mono,color:C.textDim,whiteSpace:'nowrap'}}>{fmtTime(currentTime)} / {fmtTime(duration)}</span>
      </div>
      {/* In/out sliders */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
        <div>
          <label style={mkLbl(C)}>IN POINT — {fmtTime(inPt)}</label>
          <input type="range" min={0} max={duration} step={0.1} value={inPt}
            onChange={e=>updateIn(e.target.value)}
            style={{width:'100%',accentColor:C.green,background:`linear-gradient(to right,${C.green} ${inPt/duration*100}%,${C.border} ${inPt/duration*100}%)`}}/>
        </div>
        <div>
          <label style={mkLbl(C)}>OUT POINT — {fmtTime(outPt)}</label>
          <input type="range" min={0} max={duration} step={0.1} value={outPt}
            onChange={e=>updateOut(e.target.value)}
            style={{width:'100%',accentColor:C.red,background:`linear-gradient(to right,${C.red} ${outPt/duration*100}%,${C.border} ${outPt/duration*100}%)`}}/>
        </div>
      </div>
      {/* Snippet label + add */}
      <div style={{display:'flex',gap:10,alignItems:'center'}}>
        <input value={label} onChange={e=>setLabel(e.target.value)} placeholder="Snippet label (optional)..."
          style={{...inp,flex:1,fontSize:11}}/>
        <div style={{...card,padding:'6px 14px',background:selDur>30?C.redBg:C.accentBg,
          border:`1px solid ${selDur>30?C.red:C.accent}44`,borderRadius:5,minWidth:90,textAlign:'center'}}>
          <div style={{fontSize:13,fontFamily:C.mono,color:selDur>30?C.red:C.accent,fontWeight:700}}>{selDur.toFixed(1)}s</div>
          <div style={{fontSize:8,fontFamily:C.mono,color:C.textDim}}>MAX 30s</div>
        </div>
        <Btn onClick={addSnippet} disabled={selDur>30||selDur<1||snippets.length>=10}>
          <Plus size={13}/>ADD SNIPPET
        </Btn>
      </div>
      {snippets.length>=10&&<div style={{fontSize:10,color:C.amber,fontFamily:C.mono,marginTop:8}}>Maximum 10 snippets reached — remove one to add more.</div>}
    </div>
  );
}

// ── CaptionEditor ─────────────────────────────────────────────────────────────

    <div style={{borderTop:`1px solid ${C.border}`,paddingTop:10,marginTop:8}}>

            borderRadius:3,padding:'3px 9px',cursor:'pointer',fontSize:8,fontFamily:C.mono,
            color:cap.enabled?C.accent:C.textDim,flexShrink:0}}>
          {cap.enabled?'ON':'OFF'}
        </button>
      </div>
      {cap.enabled&&(
        <div style={{display:'flex',flexDirection:'column',gap:9}}>
          {/* Text */}
          <div>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
              <label style={mkLbl(C)}>CAPTION TEXT</label>

          {/* Three sliders */}

              <label style={mkLbl(C)}>START  {cap.startTime.toFixed(1)}s</label>

                value={Math.min(cap.startTime,maxStart)}
                onChange={e=>update({startTime:+e.target.value})}

              <div style={{fontSize:8,fontFamily:C.mono,color:C.textDim,marginTop:2}}>0 – {maxStart.toFixed(1)}s</div>
            </div>
            <div>
              <label style={mkLbl(C)}>SHOW FOR  {cap.duration}s</label>
              <input type="range" min={1} max={10} step={1} value={cap.duration}
                onChange={e=>update({duration:+e.target.value})}
                style={{width:'100%',accentColor:C.accent}}/>
              <div style={{fontSize:8,fontFamily:C.mono,color:C.textDim,marginTop:2}}>1 – 10s</div>
            </div>
            <div>
              <label style={mkLbl(C)}>FONT SIZE  {cap.fontSize}px</label>
              <input type="range" min={16} max={72} step={2} value={cap.fontSize}
                onChange={e=>update({fontSize:+e.target.value})}
                style={{width:'100%',accentColor:C.accent}}/>
              <div style={{fontSize:8,fontFamily:C.mono,color:C.textDim,marginTop:2}}>16 – 72px</div>
            </div>
          </div>
          {/* Hint */}
          <div style={{fontSize:8,fontFamily:C.mono,color:C.textDim,lineHeight:1.5}}>
            Caption appears at <strong style={{color:C.accent}}>{cap.startTime.toFixed(1)}s</strong> into snippet
            for <strong style={{color:C.accent}}>{cap.duration}s</strong>.

          </div>
        </div>
      )}

  );
}

// ── ModTimeline ───────────────────────────────────────────────────────────────
function ModTimeline({snippets,timeline,setTimeline,setMod}){
  const C=useTheme();const secT=mkSecT(C),card=mkCard(C),inp=mkInp(C);
  const totalDur=timeline.reduce((s,t)=>{
    const sn=snippets.find(x=>x.id===t.snippetId);
    const snDur=sn?(sn.outPoint-sn.inPoint):0;
    const trDur=t.transition.type==='ltx-video'?(t.transition.frames||49)/24:t.transition.type==='fade'?1:0;
    return s+snDur+trDur;
  },0);
  const targetDur=300,durColor=Math.abs(totalDur-targetDur)<30?C.green:totalDur>330?C.amber:C.textDim;
  const moveUp=i=>{if(i===0)return;setTimeline(prev=>{const a=[...prev];[a[i-1],a[i]]=[a[i],a[i-1]];return a;});};
  const moveDown=i=>{if(i===timeline.length-1)return;setTimeline(prev=>{const a=[...prev];[a[i],a[i+1]]=[a[i+1],a[i]];return a;});};
  const setTransType=(id,type)=>setTimeline(prev=>prev.map(t=>t.id===id?{...t,transition:{...t.transition,type}}:t));
  const setTransPrompt=(id,p)=>setTimeline(prev=>prev.map(t=>t.id===id?{...t,transition:{...t.transition,prompt:p}}:t));

  return(
    <div style={{animation:'fadeIn 0.2s ease'}}>
      <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:16}}>
        <span style={secT}>COMPILATION TIMELINE</span>
        <div style={{marginLeft:'auto',display:'flex',gap:12,alignItems:'center'}}>
          <div style={{fontFamily:C.mono,fontSize:12,color:durColor}}>
            {fmtTime(totalDur)} <span style={{color:C.textDim,fontSize:9}}>/ target {fmtTime(targetDur)}</span>
          </div>
          <Tag color={durColor}>{timeline.length} CLIPS</Tag>
        </div>
      </div>
      {timeline.length===0&&<div style={{...card,textAlign:'center',padding:40}}>
        <Layers size={32} color={C.textDim} style={{margin:'0 auto 12px'}}/>
        <div style={{fontSize:12,color:C.textHi,marginBottom:6}}>Timeline is empty</div>
        <div style={{fontSize:11,color:C.textDim,marginBottom:16}}>Add snippets first, then come back here to arrange them</div>

// ── RestartComfyBtn ───────────────────────────────────────────────────────────
// Posts to serve.ps1's /api/restart-comfyui endpoint, then polls until ComfyUI responds
function RestartComfyBtn({setComfyOk}){
  const C=useTheme();
  const [state,setState]=useState('idle'); // idle | restarting | waiting | done | error
  const [msg,setMsg]=useState('');

  const restart=async()=>{
    setState('restarting');setMsg('Sending restart command...');
    try{
      const r=await fetch('http://localhost:8765/api/restart-comfyui',{method:'POST',body:''});
      const d=await r.json();
      if(!d.ok)throw new Error(d.message||'restart failed');
      setState('waiting');setMsg('Waiting for ComfyUI to come back online...');
      setComfyOk(null); // show amber "checking" dot
      // Poll /health until ComfyUI responds (up to 90s)
      const started=Date.now();
      const poll=setInterval(async()=>{
        try{
          const h=await fetch(`${COMFY_URL}/queue`,{signal:AbortSignal.timeout(2000)});
          if(h.ok){
            clearInterval(poll);
            setComfyOk(true);
            setState('done');setMsg('ComfyUI is back online');
            setTimeout(()=>{setState('idle');setMsg('');},3000);
          }
        }catch(_){}
        if(Date.now()-started>90000){
          clearInterval(poll);
          setState('error');setMsg('Timed out — ComfyUI did not respond within 90s');
        }
      },2000);
    }catch(e){
      setState('error');setMsg(e.message);
    }
  };

  const busy=state==='restarting'||state==='waiting';
  const color=state==='done'?C.green:state==='error'?C.red:C.amber;
  const bg=state==='done'?C.greenBg:state==='error'?C.redBg:C.amberBg;

  return(
    <div style={{display:'flex',flexDirection:'column',gap:3,alignItems:'flex-start',flexShrink:0}}>
      <button onClick={restart} disabled={busy}
        title={busy?msg:'Restart ComfyUI service'}
        style={{background:busy?bg:'transparent',border:`1px solid ${busy?color:C.border}`,
          borderRadius:4,padding:'5px 10px',cursor:busy?'default':'pointer',
          display:'flex',alignItems:'center',gap:6,opacity:busy?1:1,
          transition:'all 0.15s',flexShrink:0}}>
        {busy
          ?<Loader size={11} color={color} style={{animation:'spin 1s linear infinite'}}/>
          :<RefreshCw size={11} color={C.textDim}/>}
        <span style={{fontSize:9,fontFamily:C.mono,
          color:busy?color:C.textDim,whiteSpace:'nowrap'}}>
          {state==='restarting'?'RESTARTING...':state==='waiting'?'WAITING...':state==='done'?'ONLINE':'RESTART COMFYUI'}
        </span>
      </button>
      {msg&&state!=='idle'&&<div style={{fontSize:8,fontFamily:C.mono,color,maxWidth:220,lineHeight:1.5}}>{msg}</div>}
    </div>
  );
}

// ── ModEffects ────────────────────────────────────────────────────────────────
function ModEffects({timeline,setTimeline,snippets,clips,comfyOk,setComfyOk,ollamaOk,onEnsureSession}){
  const C=useTheme();const secT=mkSecT(C),card=mkCard(C),inp=mkInp(C);
  const aiTransitions=timeline.filter(t=>t.transition.type==='ltx-video');
  const [width,setWidth]=useState(512),[height,setHeight]=useState(288);
  const [transFrames,setTransFrames]=useState(49);
  const [genAll,setGenAll]=useState(false);
  const FRAME_OPTS=[{f:25,label:'1s',fps:24},{f:33,label:'1.5s',fps:24},{f:49,label:'2s',fps:24},{f:73,label:'3s',fps:24}];

  const generateOne=useCallback(async(itemId,prompt,autoPrompt)=>{
    const setStatus=s=>setTimeline(prev=>prev.map(t=>t.id===itemId?{...t,transition:{...t.transition,status:s}}:t));
    setTimeline(prev=>prev.map(t=>t.id===itemId?{...t,transition:{...t.transition,generating:true,status:'Preparing...'}}:t));
    try{
      // ── Find preceding clip to extract last frame for I2V conditioning ──────
      const itemIdx=timeline.findIndex(t=>t.id===itemId);
      const prevItem=itemIdx>0?timeline[itemIdx-1]:null;
      const prevSn=prevItem?snippets.find(s=>s.id===prevItem.snippetId):null;
      const prevClip=prevSn?clips.find(c=>c.id===prevSn.clipId):null;

      // ── Build scene context from Gemma analysis for both adjacent clips ─────
      const snA=prevSn;
      const snB=snippets.find(s=>s.id===timeline[itemIdx+1]?.snippetId);
      const clipA=snA?clips.find(c=>c.id===snA.clipId):null;
      const clipB=snB?clips.find(c=>c.id===snB.clipId):null;
      const aA=clipA?.analysis;const aB=clipB?.analysis;
      // Compact scene description: "mood setting — subject action"
      const sceneDesc=(a,sn)=>{
        if(!a)return sn?.label||null;
        const parts=[a.mood,a.setting,a.subject&&a.action?`${a.subject} ${a.action}`:a.subject||a.action].filter(Boolean);
        return parts.join(', ');
      };
      const descA=sceneDesc(aA,snA);
      const descB=sceneDesc(aB,snB);

      // ── Derive final prompt ───────────────────────────────────────────────
      let finalPrompt=null;

      if(prompt){
        // User typed or selected a prompt — augment it with scene context if analysis is available
        if((descA||descB)&&ollamaOk){
          try{
            setStatus('Enriching prompt with scene context...');
            const sys='You are a video editor refining LTX-Video transition prompts. Incorporate the scene context naturally into the effect description. Output one sentence only, max 35 words, no explanations.';
            const usr=`Effect style: "${prompt}"\nOutgoing scene: ${descA||'unknown'}\nIncoming scene: ${descB||'unknown'}\nWrite a single transition prompt that combines this effect with the visual scene context.`;
            const raw=await gemma4Call(sys,usr);
            finalPrompt=raw.trim().replace(/^["']|["']$/g,'');
          }catch(_){
            // Gemma unavailable — append scene context as suffix instead
            const suffix=[descA&&`from: ${descA}`,descB&&`to: ${descB}`].filter(Boolean).join('; ');
            finalPrompt=suffix?`${prompt} — ${suffix}`:prompt;
          }
        }else{
          finalPrompt=prompt; // no analysis yet, use preset as-is
        }
      }else if(ollamaOk){
        // No user prompt — ask Gemma to generate one from scratch using scene context
        try{
          setStatus('Asking Gemma for transition prompt...');
          const ctxA=aA?JSON.stringify({subject:aA.subject,action:aA.action,setting:aA.setting,mood:aA.mood,colors:aA.color_palette}):snA?.label||'unknown scene';
          const ctxB=aB?JSON.stringify({subject:aB.subject,action:aB.action,setting:aB.setting,mood:aB.mood,colors:aB.color_palette}):snB?.label||'unknown scene';
          const sys='You are a video editor writing LTX-Video transition prompts. Write concise, vivid, visual descriptions only — no explanations, no JSON, no bullet points. Single sentence, max 30 words.';
          const usr=`Write a seamless visual transition prompt bridging these two scenes.\nScene A (outgoing): ${ctxA}\nScene B (incoming): ${ctxB}\nThe transition should feel motivated by Scene A and naturally arrive at Scene B.`;
          const raw=await gemma4Call(sys,usr);
          finalPrompt=raw.trim().replace(/^["']|["']$/g,'');
        }catch(_){/* fall through */}
      }
      if(!finalPrompt)finalPrompt=autoPrompt;

      // ── Extract last frame of preceding clip for image conditioning ───────
      let startFrame=null;
      if(prevClip?.url&&prevSn){
        try{
          setStatus('Extracting conditioning frame...');
          // Seek to 0.5s before outPoint (clamped to inPoint) for the last meaningful frame
          const seekT=Math.max(prevSn.inPoint,(prevSn.outPoint||prevClip.duration||0)-0.5);
          const b64=await extractFrameFromUrl(prevClip.url,seekT,width);
          setStatus('Uploading frame to ComfyUI...');
          startFrame=await uploadFrameToComfy(b64);
        }catch(e){
          // Non-fatal — fall back to text-to-video if frame extraction fails
          console.warn('EdgeVideo: frame conditioning skipped —',e.message);
        }
      }

      const wf=buildLTXWorkflow(finalPrompt,width,height,transFrames,startFrame);
      setStatus(startFrame?'Generating (I2V conditioned)...':'Submitting to ComfyUI...');
      const url=await comfySubmit(wf,s=>setStatus(s));
      // Auto-save transition blob to SWF (if server available)
      let swfSaved=false;
      if(onEnsureSession){
        try{
          setStatus('Saving transition to session...');
          const {sid}=await onEnsureSession();
          const blob=await fetch(url).then(r=>r.blob());
          const fname=`transition_${itemId.slice(0,6)}.mp4`;
          await fetch(`${SERVE_URL}/api/session/${sid}/save-asset`,{
            method:'POST',
            headers:{'X-Filename':fname,'Content-Type':'application/octet-stream'},
            body:blob
          });
          swfSaved=true;
        }catch(e2){console.warn('EdgeVideo: transition SWF save skipped',e2&&e2.message||String(e2));}
      }
      // Store transFrames so buildScript can compute silence duration for this transition
      setTimeline(prev=>prev.map(t=>t.id===itemId?{...t,transition:{...t.transition,
        generating:false,videoUrl:url,frames:transFrames,status:null,
        usedPrompt:finalPrompt,conditioned:!!startFrame,swfSaved}}:t));
    }catch(e){
      setTimeline(prev=>prev.map(t=>t.id===itemId?{...t,transition:{...t.transition,generating:false,status:null,error:e.message}}:t));
    }
  },[width,height,transFrames,setTimeline,timeline,snippets,clips,ollamaOk]);

  const autoPromptFor=useCallback((idx)=>{
    if(idx<0||idx>=timeline.length-1)return'Smooth cinematic transition';
    const snA=snippets.find(x=>x.id===timeline[idx].snippetId);
    const snB=snippets.find(x=>x.id===timeline[idx+1]?.snippetId);
    const clipA=snA?clips.find(c=>c.id===snA.clipId):null;
    const clipB=snB?clips.find(c=>c.id===snB.clipId):null;
    const aA=clipA?.analysis;const aB=clipB?.analysis;
    // Build a richer fallback prompt from analysis data when available
    if(aA||aB){
      const fromDesc=aA?`${aA.mood||''} ${aA.setting||''} with ${aA.subject||''} ${aA.action||''}`.trim():(snA?.label||'scene A');
      const toDesc=aB?`${aB.mood||''} ${aB.setting||''} with ${aB.subject||''} ${aB.action||''}`.trim():(snB?.label||'scene B');
      return`Smooth cinematic transition from ${fromDesc} to ${toDesc}, seamless visual flow, high quality`;
    }
    return`Smooth cinematic transition from ${snA?.label||'scene'} to ${snB?.label||'next scene'}, high quality`;
  },[timeline,snippets,clips]);

  const generateAll=useCallback(async()=>{
    setGenAll(true);
    const aiItems=timeline.map((t,i)=>({...t,idx:i})).filter(t=>t.transition.type==='ltx-video'&&!t.transition.videoUrl);
    for(const item of aiItems){
      if(!item.transition.generating)
        await generateOne(item.id,item.transition.prompt,autoPromptFor(item.idx));
    }
    setGenAll(false);
  },[timeline,generateOne,autoPromptFor]);

  return(
    <div style={{animation:'fadeIn 0.2s ease'}}>
      <span style={secT}>AI TRANSITION GENERATOR  COMFYUI + LTX-VIDEO</span>
      {/* ComfyUI status */}
      <div style={{...card,marginBottom:16,display:'flex',gap:16,alignItems:'center',padding:'10px 14px'}}>
        <div style={{width:8,height:8,borderRadius:'50%',background:comfyOk?C.green:comfyOk===false?C.red:C.amber,animation:comfyOk===null?'pulse 1.5s infinite':undefined,flexShrink:0}}/>
        <div style={{flex:1}}>
          <div style={{fontSize:11,color:C.textHi,marginBottom:2}}>ComfyUI — {comfyOk?'Connected':'Offline'}</div>
          <div style={{fontSize:9,fontFamily:C.mono,color:C.textDim}}>{COMFY_URL}  |  Video: {_ltxCkpt}  |  Text: {_t5Encoder}</div>
        </div>
        {!comfyOk&&<div style={{fontSize:10,color:C.amber,fontFamily:C.mono,maxWidth:220,lineHeight:1.6}}>Start: python main.py --listen --enable-cors-header  |  Nodes: ComfyUI-LTXVideo + VideoHelperSuite</div>}
        <RestartComfyBtn setComfyOk={setComfyOk}/>
      </div>
      {/* Settings row */}
      <div style={{display:'flex',gap:12,marginBottom:16,alignItems:'flex-end'}}>
        <div style={{flex:1}}>
          <label style={mkLbl(C)}>Output Width</label>
          <select value={width} onChange={e=>{const w=Number(e.target.value);setWidth(w);setHeight(Math.round(w*9/16/32)*32);}} style={inp}>
            <option value={512}>512×288 — 8GB VRAM (RTX 4070)</option>
            <option value={640}>640×352 — 10GB VRAM</option>
            <option value={704}>704×384 — 12GB VRAM</option>
            <option value={768}>768×432 — 16GB VRAM</option>
          </select>
        </div>
        <div style={{flex:1}}>
          <label style={mkLbl(C)}>Transition Duration</label>
          <select value={transFrames} onChange={e=>setTransFrames(Number(e.target.value))} style={inp}>
            {FRAME_OPTS.map(o=><option key={o.f} value={o.f}>{o.label} ({o.f} frames @ {o.fps}fps)</option>)}
          </select>
        </div>
        <Btn onClick={generateAll} disabled={!comfyOk||aiTransitions.length===0||genAll}>
          <Sparkles size={13}/>{genAll?'GENERATING ALL...':'GENERATE ALL'}
        </Btn>
      </div>
      {/* Transition cards */}
      {aiTransitions.length===0&&<div style={{...card,textAlign:'center',padding:32,color:C.textDim,fontSize:11}}>
        No AI transitions configured. Go to Timeline and set transition type to "AI GEN" between clips.
      </div>}
      {timeline.map((item,i)=>{
        if(item.transition.type!=='ltx-video')return null;
        const snA=snippets.find(x=>x.id===timeline[i]?.snippetId);
        const snB=snippets.find(x=>x.id===timeline[i+1]?.snippetId);
        if(!snB)return null;
        const auto=autoPromptFor(i);
        return(
          <div key={item.id} style={{...card,marginBottom:12,animation:'fadeIn 0.2s ease'}}>
            <div style={{display:'flex',gap:12,alignItems:'flex-start',marginBottom:12}}>
              <div style={{flex:1}}>
                <div style={{fontSize:9,fontFamily:C.mono,color:C.textDim,marginBottom:4}}>TRANSITION {i+1} OF {aiTransitions.length}</div>
                <div style={{fontSize:12,color:C.textHi}}>{snA?.label||'?'} <span style={{color:C.accent}}> ➔ </span> {snB?.label||'?'}</div>
              </div>
              {item.transition.videoUrl&&<a href={item.transition.videoUrl} download={`transition_${item.id.slice(0,6)}.mp4`} title="Save this AI-generated transition clip" style={{background:C.greenBg,border:`1px solid ${C.green}55`,borderRadius:4,padding:'4px 10px',textDecoration:'none',fontSize:9,fontFamily:C.mono,color:C.green,display:'flex',alignItems:'center',gap:5,cursor:'pointer'}}><Download size={10}/>SAVE CLIP</a>}
              {item.transition.generating&&<Tag color={C.amber} bg={C.amberBg}>GENERATING</Tag>}
            </div>
            {/* Prompt */}
            <Field label="Transition Prompt">
              <textarea value={item.transition.prompt} onChange={e=>setTimeline(prev=>prev.map(t=>t.id===item.id?{...t,transition:{...t.transition,prompt:e.target.value}}:t))}
                placeholder={auto}
                style={{...inp,minHeight:52,resize:'vertical',fontSize:11}}/>
            </Field>
            {/* Preset prompts */}
            <div style={{marginBottom:10}}>
              <div style={{fontSize:9,fontFamily:C.mono,color:C.textDim,letterSpacing:'0.1em',marginBottom:6}}>PRESET PROMPTS — click to apply, then edit:</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                {TRANSITION_PRESETS.map((p,pi)=>(
                  <button key={pi} onClick={()=>setTimeline(prev=>prev.map(t=>t.id===item.id?{...t,transition:{...t.transition,prompt:p}}:t))}
                    style={{background:item.transition.prompt===p?C.accentBg:C.surface,border:`1px solid ${item.transition.prompt===p?C.accent:C.border}`,borderRadius:3,padding:'3px 9px',cursor:'pointer',fontSize:9,fontFamily:C.mono,color:item.transition.prompt===p?C.accent:C.text,transition:'all 0.1s',textAlign:'left'}}>
                    {p}
                  </button>
                ))}
              </div>
            </div>
            {/* Status / error */}
            {item.transition.status&&<div style={{fontSize:10,fontFamily:C.mono,color:C.accent,marginBottom:8}}>
              <Loader size={10} style={{animation:'spin 1s linear infinite',display:'inline',marginRight:5}}/>{item.transition.status}
            </div>}
            {item.transition.error&&<div style={{background:C.redBg,border:`1px solid ${C.red}33`,borderRadius:4,padding:'6px 10px',fontSize:10,fontFamily:C.mono,color:C.red,marginBottom:8}}>Error: {item.transition.error}</div>}
            {/* Preview */}
            {item.transition.videoUrl&&<video src={item.transition.videoUrl} autoPlay loop muted playsInline
              style={{width:'100%',aspectRatio:'16/9',borderRadius:5,objectFit:'cover',marginBottom:6,border:`1px solid ${C.green}44`}}/>}
            {/* Generation metadata — conditioned frame + used prompt */}
            {item.transition.videoUrl&&<div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:10,alignItems:'center'}}>
              <Tag color={item.transition.conditioned?C.green:C.textDim} bg={item.transition.conditioned?C.greenBg:C.surface}>
                {item.transition.conditioned?'I2V CONDITIONED':'TEXT-TO-VIDEO'}
              </Tag>
              {item.transition.usedPrompt&&<span style={{fontSize:9,fontFamily:C.mono,color:C.textDim,flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={item.transition.usedPrompt}>
                {item.transition.usedPrompt}
              </span>}
            </div>}
            <Btn onClick={()=>generateOne(item.id,item.transition.prompt,auto)}
              disabled={!comfyOk||item.transition.generating} style={{marginTop:4}}>
              <Wand size={12}/>{item.transition.videoUrl?'REGENERATE':'GENERATE'}
            </Btn>
          </div>
        );
      })}
    </div>
  );
}

// ── CompilationPreview ────────────────────────────────────────────────────────
function CompilationPreview({clips,snippets,timeline}){
  const C=useTheme();
  const vidRef=useRef(null);
  const [segIdx,setSegIdx]=useState(0);
  const [playing,setPlaying]=useState(false);
  const [ready,setReady]=useState(false);
  // Refs shadow state so event handlers never capture stale closures
  const segIdxRef=useRef(0);
  const segsRef=useRef([]);

  // Build flat segment list: clips interleaved with AI transition clips where generated
  const segments=useMemo(()=>{
    const result=[];
    timeline.forEach((item,i)=>{
      const sn=snippets.find(s=>s.id===item.snippetId);
      const clip=sn?clips.find(c=>c.id===sn.clipId):null;
      if(!sn||!clip)return;
      result.push({url:clip.url,inPt:sn.inPoint,outPt:sn.outPoint,label:sn.label,type:'clip'});
      // Insert AI transition clip between this and the next snippet
      if(i<timeline.length-1&&item.transition.type==='ltx-video'&&item.transition.videoUrl)
        result.push({url:item.transition.videoUrl,inPt:0,outPt:null,label:'AI Transition',type:'transition'});
    });
    return result;
  },[clips,snippets,timeline]);

  useEffect(()=>{segsRef.current=segments;},[segments]);

  const goToSeg=useCallback((i,autoPlay)=>{
    const vid=vidRef.current;const segs=segsRef.current;
    if(!vid||!segs[i])return;
    segIdxRef.current=i;setSegIdx(i);setReady(false);
    vid.src=segs[i].url;vid.currentTime=segs[i].inPt||0;
    if(autoPlay)vid.play().catch(()=>{});
  },[]);

  useEffect(()=>{
    segIdxRef.current=0;setSegIdx(0);setPlaying(false);goToSeg(0,false);
  },[segments.length,goToSeg]);

  // advance() is called when the current segment ends (timeupdate threshold OR ended event)
  const advance=useCallback(()=>{
    const vid=vidRef.current;if(!vid)return;
    const next=segIdxRef.current+1;
    if(next<segsRef.current.length){
      goToSeg(next,true);        // autoPlay=true: advance always fires while playing
    }else{
      vid.pause();setPlaying(false);
      goToSeg(0,false);          // rewind to start, paused
    }
  },[goToSeg]);

  // Snippet clips end at their outPt — advance via timeupdate
  const onTimeUpdate=useCallback(()=>{
    const vid=vidRef.current;if(!vid)return;
    const seg=segsRef.current[segIdxRef.current];
    if(!seg||seg.outPt===null)return;  // transition clips use onEnded
    if(vid.currentTime>=seg.outPt-0.1)advance();
  },[advance]);

  // Transition clips (full video) end naturally — advance via ended event
  const onEnded=useCallback(()=>advance(),[advance]);

  const togglePlay=()=>{
    const vid=vidRef.current;if(!vid||!segsRef.current.length)return;
    if(playing){vid.pause();setPlaying(false);}
    else{
      const seg=segsRef.current[segIdxRef.current];
      if(seg)vid.currentTime=seg.inPt||0;
      vid.play().then(()=>setPlaying(true)).catch(()=>{});
    }
  };

  if(!segments.length)return(
    <div style={{...mkCard(C),textAlign:'center',padding:28,color:C.textDim,marginBottom:16}}>
      <Video size={26} color={C.textDim} style={{margin:'0 auto 10px'}}/>
      <div style={{fontSize:11}}>Add snippets to the timeline to preview the compilation</div>
    </div>
  );

  const curSeg=segments[segIdx];
  return(
    <div style={{...mkCard(C),padding:0,overflow:'hidden',marginBottom:16}}>
      <div style={{aspectRatio:'16/9',background:'#030810',position:'relative'}}>
        <video ref={vidRef} style={{width:'100%',height:'100%',objectFit:'contain'}}
          onCanPlay={()=>setReady(true)} onTimeUpdate={onTimeUpdate} onEnded={onEnded}
          onPlay={()=>setPlaying(true)} onPause={()=>setPlaying(false)}/>
        {!ready&&<div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <Loader size={20} color={C.accent} style={{animation:'spin 1s linear infinite'}}/>
        </div>}
        {curSeg?.type==='transition'&&<div style={{position:'absolute',top:8,left:8}}>
          <Tag color={C.accent} bg={C.accentBg}>AI TRANSITION</Tag>
        </div>}
      </div>
      <div style={{padding:'10px 14px',background:C.surface,display:'flex',alignItems:'center',gap:10,borderTop:`1px solid ${C.border}`}}>
        <button onClick={togglePlay} style={{background:C.accentBg,border:`1px solid ${C.accent}44`,borderRadius:4,padding:'5px 11px',cursor:'pointer',color:C.accent,display:'flex',alignItems:'center',gap:5}}>
          {playing?<Pause size={12}/>:<Play size={12}/>}
        </button>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:10,color:curSeg?.type==='transition'?C.accent:C.textHi,fontFamily:C.mono,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
            {curSeg?.label||`Segment ${segIdx+1}`}
          </div>
          <div style={{fontSize:8,fontFamily:C.mono,color:C.textDim}}>
            {curSeg?.type==='transition'?'TRANSITION':'CLIP'} {segIdx+1} / {segments.length}
          </div>
        </div>
        <div style={{display:'flex',gap:4,alignItems:'center'}}>
          {segments.map((seg,i)=>(
            <div key={i} onClick={()=>goToSeg(i,false)}
              style={{width:seg.type==='transition'?5:8,height:seg.type==='transition'?5:8,
                borderRadius:'50%',cursor:'pointer',flexShrink:0,transition:'background 0.15s',
                background:i===segIdx?C.accent:seg.type==='transition'?C.accentBg:C.border,
                border:seg.type==='transition'?`1px solid ${C.accent}44`:'none'}}/>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── ModAudio ──────────────────────────────────────────────────────────────────
function ModAudio({audioUrl,setAudioUrl,audioName,setAudioName,onEnsureSession,audioSwfSaved,setAudioSwfSaved}){
  const C=useTheme();const secT=mkSecT(C),card=mkCard(C);
  const fileRef=useRef(null);
  const [dragging,setDragging]=useState(false);
  const [saving,setSaving]=useState(false);

  const loadFile=useCallback(async(file)=>{
    if(!file)return;
    const ok=file.type.startsWith('audio/')||/\.(mp3|wav|ogg|m4a|aac|flac)$/i.test(file.name);
    if(!ok)return;
    if(audioUrl)URL.revokeObjectURL(audioUrl);
    setAudioUrl(URL.createObjectURL(file));
    setAudioName(file.name);
    setAudioSwfSaved?.(false);
    // Auto-save to SWF if server available
    if(onEnsureSession){
      setSaving(true);
      try{
        const {sid}=await onEnsureSession();
        await fetch(`${SERVE_URL}/api/session/${sid}/save-asset`,{
          method:'POST',
          headers:{'X-Filename':file.name,'Content-Type':file.type||'application/octet-stream'},
          body:file
        });
        setAudioSwfSaved?.(true);
      }catch(e){console.warn('EdgeVideo: audio SWF save skipped',e&&e.message||String(e));}
      finally{setSaving(false);}
    }
  },[audioUrl,setAudioUrl,setAudioName,onEnsureSession,setAudioSwfSaved]);

  const onDrop=useCallback((e)=>{
    e.preventDefault();setDragging(false);loadFile(e.dataTransfer.files[0]);
  },[loadFile]);

  return(
    <div style={{animation:'fadeIn 0.2s ease'}}>
      <span style={secT}>AUDIO TRACK — MP3 / WAV / OGG / M4A</span>
      {/* Drop / click zone */}
      <div onDrop={onDrop} onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)}
        onClick={()=>fileRef.current?.click()}
        style={{...card,border:`2px dashed ${dragging?C.accent:C.border}`,background:dragging?C.accentBg:'transparent',marginBottom:14,minHeight:100,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:10,cursor:'pointer',transition:'all 0.15s'}}>
        <input ref={fileRef} type="file" accept="audio/*" style={{display:'none'}} onChange={e=>loadFile(e.target.files[0])}/>
        <Music size={26} color={dragging?C.accent:C.textDim}/>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:12,color:dragging?C.accent:C.textHi,marginBottom:3}}>
            {audioUrl?'Drop to replace  ·  or click to browse':'Drop an audio file here  ·  or click to browse'}
          </div>
          <div style={{fontSize:10,fontFamily:C.mono,color:C.textDim}}>MP3  WAV  OGG  M4A  AAC  FLAC</div>
        </div>
      </div>
      {/* Embedded player */}
      {audioUrl?(
        <div style={card}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
            <Music size={13} color={C.accent}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:11,color:C.textHi,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{audioName}</div>
              <div style={{fontSize:9,fontFamily:C.mono,color:saving?C.accent:audioSwfSaved?C.green:C.textDim}}>
                {saving?'Saving to session…':audioSwfSaved?'Saved to session ✓':'In memory — will upload on export'}
              </div>
            </div>
            <button onClick={()=>{URL.revokeObjectURL(audioUrl);setAudioUrl(null);setAudioName('');}}
              title="Remove audio" style={{background:'transparent',border:'none',cursor:'pointer',color:C.textDim,padding:3,flexShrink:0}}>
              <X size={12}/>
            </button>
          </div>
          <audio controls src={audioUrl} style={{width:'100%',display:'block',borderRadius:4}}/>
        </div>
      ):(
        <div style={{...card,textAlign:'center',padding:20,color:C.textDim,fontSize:10,fontFamily:C.mono}}>
          No audio loaded — final compilation will be video only
        </div>
      )}
    </div>
  );
}

// ── ModExport ─────────────────────────────────────────────────────────────────
function ModExport({clips,snippets,timeline,audioUrl,audioName,audioSwfSaved,diskFreeGb,
                    gwfPath,swfPath,sessionId,onEnsureSession,serveOnline}){
  const C=useTheme();const secT=mkSecT(C),card=mkCard(C),inp=mkInp(C);
  const [projName,setProjName]=useState('my_compilation');
  const [expQ,setExpQ]=useState('hd');
  // mix: 0=clip only · 50=balanced · 100=music only
  // clip% = mix<=50 ? 100 : (100-mix)*2   music% = mix<=50 ? mix*2 : 100
  const [mix,setMix]=useState(40); // default: clip 100%, music 80%
  // Phase: 'idle' | 'preparing' | 'encoding' | 'done' | 'error'
  const [phase,setPhase]=useState('idle');
  const [phaseMsg,setPhaseMsg]=useState('');
  const [frame,setFrame]=useState(0);
  const [elapsed,setElapsed]=useState(0);
  const [errMsg,setErrMsg]=useState('');
  const [outputFile,setOutputFile]=useState('');
  const [outputSize,setOutputSize]=useState(0);
  const pollRef=useRef(null);
  const activeSessionRef=useRef(null);

  // cleanup poll on unmount
  useEffect(()=>()=>{if(pollRef.current)clearInterval(pollRef.current);},[]);
  // reset phase if serve goes offline mid-encode
  useEffect(()=>{if(!serveOnline&&phase==='encoding'){setPhase('error');setErrMsg('Server went offline during export');}
  },[serveOnline,phase]);

  const totalDur=useMemo(()=>timeline.reduce((s,t)=>{
    const sn=snippets.find(x=>x.id===t.snippetId);return s+(sn?sn.outPoint-sn.inPoint:0);
  },0),[timeline,snippets]);
  const aiDone=timeline.filter(t=>t.transition.type==='ltx-video'&&t.transition.videoUrl).length;
  const aiTotal=timeline.filter(t=>t.transition.type==='ltx-video').length;
  const quals={draft:{preset:'fast',crf:28,label:'Draft 720p'},hd:{preset:'medium',crf:23,label:'HD 1080p'},'4k':{preset:'slow',crf:18,label:'4K 2160p'}};
  const q=quals[expQ];

  // ── Build export script (uses GWF/SWF absolute paths when serve online) ──────
  const buildScript=useCallback((resolvedGwf,resolvedSwf)=>{
    if(!timeline.length)return'# No timeline items — add clips first';
    const useServer=!!(resolvedGwf&&resolvedSwf);
    // gwfName may be missing on clips loaded before server was ready —
    // recover it from the serve URL query param (name=filename.mp4)
    const resolveGwfName=(clip)=>{
      if(clip.gwfName)return clip.gwfName;
      if(clip.url){
        try{const m=clip.url.match(/[?&]name=([^&]+)/);if(m)return decodeURIComponent(m[1]);}catch(_){}
      }
      return null;
    };
    const inputMap=new Map();let idx=0;const inputLines=[];
    timeline.map(t=>snippets.find(s=>s.id===t.snippetId)).filter(Boolean).forEach(sn=>{
      const clip=clips.find(c=>c.id===sn.clipId);
      if(clip&&!inputMap.has(clip.id)){
        inputMap.set(clip.id,idx++);
        const gwfName=resolveGwfName(clip);
        const src=useServer&&gwfName
          ?`${resolvedGwf}\\${gwfName}`
          :`${clip.name}.mp4`;
        inputLines.push(`  -i "${src}"`);
      }
    });
    const trMap=new Map();
    timeline.forEach(item=>{
      if(item.transition.type==='ltx-video'&&item.transition.videoUrl){
        trMap.set(item.id,idx++);
        const src=useServer?`${resolvedSwf}\\transition_${item.id.slice(0,6)}.mp4`:`transition_${item.id.slice(0,6)}.mp4`;
        inputLines.push(`  -i "${src}"`);
      }
    });
    let audioIdx=-1;
    if(audioUrl){
      const src=useServer?`${resolvedSwf}\\${audioName||'audio.mp3'}`:audioName||'audio.mp3';
      inputLines.push(`  -i "${src}"`);
      audioIdx=idx++;   // record which ffmpeg input index the audio file occupies
    }

    const segs=[];
    timeline.forEach((item,i)=>{
      const sn=snippets.find(s=>s.id===item.snippetId);if(!sn)return;
      const clip=clips.find(c=>c.id===sn.clipId);if(!clip)return;
      segs.push({type:'clip',ci:inputMap.get(clip.id),inPt:sn.inPoint,outPt:sn.outPoint});
      if(i<timeline.length-1&&trMap.has(item.id)){
        const dur=(item.transition.frames||49)/24;
        segs.push({type:'ai',ti:trMap.get(item.id),dur});
      }
    });

    const filters=[];
    segs.forEach((seg,j)=>{
      if(seg.type==='clip'){
        filters.push(`  [${seg.ci}:v]trim=start=${seg.inPt.toFixed(3)}:end=${seg.outPt.toFixed(3)},setpts=PTS-STARTPTS,scale=1920:1080,setsar=1,fps=24[vs${j}]`);
        filters.push(`  [${seg.ci}:a]atrim=start=${seg.inPt.toFixed(3)}:end=${seg.outPt.toFixed(3)},asetpts=PTS-STARTPTS[as${j}]`);
      }else{
        filters.push(`  [${seg.ti}:v]scale=1920:1080,setsar=1,fps=24[vs${j}]`);
        filters.push(`  aevalsrc=0:c=stereo:s=44100:d=${seg.dur.toFixed(3)}[as${j}]`);
      }
    });
    const concatIn=segs.map((_,j)=>`[vs${j}][as${j}]`).join('');
    filters.push(`  ${concatIn}concat=n=${segs.length}:v=1:a=1[outv][outa_clips]`);

    const captionDrawtexts=[];
    let absT=0;
    timeline.forEach((item,i)=>{
      const sn=snippets.find(s=>s.id===item.snippetId);if(!sn)return;
      const snDur=sn.outPoint-sn.inPoint;
      if(sn.caption?.enabled&&sn.caption?.text){
        const cap=sn.caption;
        const t0=absT+(cap.startTime??2);
        const t1=t0+(cap.duration??3);
        const fs=Math.round((cap.fontSize??32)*4);
        const txt=cap.text.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/:/g,'\\:');
        captionDrawtexts.push(
          `drawtext=text='${txt}':fontfile=arialbd.ttf`+
          `:fontsize=${fs}:fontcolor=white`+
          `:x=(w-text_w)/2:y=h*0.85-text_h/2`+
          `:box=1:boxcolor=black@0.45:boxborderw=10`+
          `:enable='between(t,${t0.toFixed(3)},${t1.toFixed(3)})'`
        );
      }
      absT+=snDur;
      if(i<timeline.length-1&&item.transition.type==='ltx-video'&&item.transition.videoUrl)
        absT+=(item.transition.frames||49)/24;
    });
    let videoOutLabel='outv';
    if(captionDrawtexts.length>0){
      filters.push(`  [outv]${captionDrawtexts.join(',\n  ')}[outv_cap]`);
      videoOutLabel='outv_cap';
    }

    const cvol=(mix<=50?1:(100-mix)/50).toFixed(2);
    const mvol=(mix<=50?mix/50:1).toFixed(2);
    let audioMapArg,audioEnc;
    if(audioUrl){
      filters.push(`  [outa_clips]volume=${cvol}[clips_adj]`);
      filters.push(`  [${audioIdx}:a]asetpts=PTS-STARTPTS,volume=${mvol}[music_adj]`);
      filters.push(`  [clips_adj][music_adj]amix=inputs=2:duration=longest:normalize=0[outa]`);
      audioMapArg='-map "[outa]" ';audioEnc=' -c:a aac -b:a 192k';
    }else{
      filters.push(`  [outa_clips]volume=${cvol}[outa]`);
      audioMapArg='-map "[outa]" ';audioEnc=' -c:a aac -b:a 192k';
    }
    return[
      `# EdgeVideo Export Script — ${useServer?'server-managed':'standalone'}`,
      `# Project : ${projName}  |  Quality: ${q.label}`,
      `# Duration: ${fmtTime(totalDur)}  |  Clips: ${timeline.length}  |  AI transitions: ${aiDone}  |  Captions: ${captionDrawtexts.length}`,
      `# Generated: ${new Date().toLocaleString()}`,
      ``,
      `$ffmpeg = "ffmpeg"`,
      ``,
      `& $ffmpeg \``,
      ...inputLines.map(l=>`${l} \``),
      `  -filter_complex @"`,
      filters.join(';\n'),
      `"@ \``,
      `  -map "[${videoOutLabel}]" ${audioMapArg}\``,
      `  -c:v libx264 -preset ${q.preset} -crf ${q.crf}${audioEnc} \``,
      `  -t ${totalDur.toFixed(3)} \``,
      `  "${projName}.mp4"`,
      ``,
      `if ($LASTEXITCODE -eq 0) {`,
      `  Write-Host "Export complete: ${projName}.mp4" -ForegroundColor Green`,
      `} else {`,
      `  Write-Host "FFmpeg error - check output above" -ForegroundColor Red`,
      `}`,
    ].join('\n');
  },[timeline,snippets,clips,audioUrl,audioName,projName,expQ,q,totalDur,aiDone,mix]);

  // ── Server-side export flow ──────────────────────────────────────────────────
  const startExport=useCallback(async()=>{
    if(!serveOnline||!onEnsureSession){
      // Fallback: download script
      const script=buildScript(null,null);
      const blob=new Blob(['﻿'+script],{type:'text/plain;charset=utf-8'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download=`${projName}_export.ps1`;a.click();URL.revokeObjectURL(a.href);
      return;
    }
    setPhase('preparing');setErrMsg('');setFrame(0);setElapsed(0);
    setPlayUrl(null);setActionMsg(null);
    try{
      setPhaseMsg('Creating session…');
      const {sid,swf}=await onEnsureSession();
      activeSessionRef.current=sid;

      // Upload any AI transitions not yet saved to SWF
      const unsavedTrans=timeline.filter(t=>t.transition.type==='ltx-video'&&t.transition.videoUrl&&!t.transition.swfSaved);
      for(const item of unsavedTrans){
        setPhaseMsg(`Saving transition ${item.id.slice(0,6)}…`);
        const blob=await fetch(item.transition.videoUrl).then(r=>r.blob());
        await fetch(`${SERVE_URL}/api/session/${sid}/save-asset`,{
          method:'POST',
          headers:{'X-Filename':`transition_${item.id.slice(0,6)}.mp4`,'Content-Type':'application/octet-stream'},
          body:blob
        });
      }

      // Upload audio if not yet saved
      if(audioUrl&&!audioSwfSaved){
        setPhaseMsg('Saving audio track…');
        const blob=await fetch(audioUrl).then(r=>r.blob());
        await fetch(`${SERVE_URL}/api/session/${sid}/save-asset`,{
          method:'POST',
          headers:{'X-Filename':audioName||'audio.mp3','Content-Type':'audio/mpeg'},
          body:blob
        });
      }

      // Save state.json
      const stateData={projName,expQ,clipCount:timeline.length,totalDur,gwf:gwfPath,swf};
      await fetch(`${SERVE_URL}/api/session/${sid}/state`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(stateData)
      });

      setPhaseMsg('Starting encoder…');
      const script=buildScript(gwfPath,swf);
      const r=await fetch(`${SERVE_URL}/api/session/${sid}/export`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({script,projName})
      });
      if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.message||`Export start failed: ${r.status}`);}

      setPhase('encoding');setPhaseMsg('');
      // Poll for progress
      const t0=Date.now();
      pollRef.current=setInterval(async()=>{
        try{
          const s=await fetch(`${SERVE_URL}/api/session/${sid}/export-status`).then(r=>r.json());
          setFrame(s.frame||0);setElapsed(Math.round((Date.now()-t0)/1000));
          if(s.status==='done'){
            clearInterval(pollRef.current);pollRef.current=null;
            setOutputFile(s.outputFile||`${projName}.mp4`);
            setOutputSize(s.outputSize||0);
            setPhase('done');
          }else if(s.status==='error'){
            clearInterval(pollRef.current);pollRef.current=null;
            setPhase('error');setErrMsg('ffmpeg exited with error — check the session folder for export.log');
          }
        }catch(e){/* transient — keep polling */}
      },1500);
    }catch(e){setPhase('error');setErrMsg(e&&e.message||String(e));}
  },[serveOnline,onEnsureSession,timeline,audioUrl,audioName,audioSwfSaved,buildScript,projName,gwfPath]);

  // ── Done-panel action handlers ───────────────────────────────────────────
  const [playUrl,setPlayUrl]=useState(null);     // in-UI <video> src when set
  const [actionMsg,setActionMsg]=useState(null); // {text, color} surfaced to user
  const [actionBusy,setActionBusy]=useState(null); // 'save'|'delete'|null

  const doPlay=useCallback(()=>{
    const sid=activeSessionRef.current;if(!sid)return;
    // Use the new streaming endpoint so playback happens inline. Cache-bust
    // with t= so re-playing after a re-export doesn't load stale bytes.
    setPlayUrl(`${SERVE_URL}/api/session/${sid}/output?t=${Date.now()}`);
    setActionMsg(null);
  },[]);
  const doSaveAs=useCallback(()=>{
    const sid=activeSessionRef.current;if(!sid)return;
    // Trigger a browser download — the browser's native Save dialog appears.
    // No Tkinter dialog bridge needed.
    const a=document.createElement('a');
    a.href=`${SERVE_URL}/api/session/${sid}/download`;
    a.download=`${projName}.mp4`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setActionMsg({text:'Download started — check your browser downloads.',color:C.green});
    setTimeout(()=>setActionMsg(null),4000);
  },[C]);
  const doDelete=useCallback(async()=>{
    const sid=activeSessionRef.current;if(!sid)return;
    if(!confirm('Delete this compilation? This cannot be undone.'))return;
    setActionBusy('delete');setActionMsg(null);
    // Tear down the inline <video> so it releases any browser-side handle
    // BEFORE the server tries to rm the directory.
    setPlayUrl(null);
    try{
      const r=await fetch(`${SERVE_URL}/api/session/${sid}`,{method:'DELETE'});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.message||`HTTP ${r.status}`);
      activeSessionRef.current=null;setPhase('idle');setOutputFile('');setOutputSize(0);
    }catch(e){setActionMsg({text:`Delete failed: ${e.message}`,color:C.red});}
    finally{setActionBusy(null);}
  },[C]);
  const downloadScriptFallback=()=>{
    const script=buildScript(gwfPath,swfPath);
    const blob=new Blob(['﻿'+script],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`${projName}_export.ps1`;a.click();URL.revokeObjectURL(a.href);
  };

  const aiTransitions=timeline.filter(t=>t.transition.type==='ltx-video'&&t.transition.videoUrl);
  const usedClips=clips.filter(clip=>timeline.some(t=>{const sn=snippets.find(s=>s.id===t.snippetId);return sn?.clipId===clip.id;}));
  const canExport=timeline.length>0&&phase==='idle';

  return(
    <div style={{animation:'fadeIn 0.2s ease'}}>
      <span style={secT}>COMPILATION EXPORT</span>
      {/* Preview player */}
      <CompilationPreview clips={clips} snippets={snippets} timeline={timeline}/>
      {/* Summary stats */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:10,marginBottom:14}}>
        {[['CLIPS',timeline.length,C.blue],['DURATION',fmtTime(totalDur),Math.abs(totalDur-300)<30?C.green:C.amber],
          ['AI TRANS',`${aiDone}/${aiTotal}`,aiDone===aiTotal&&aiTotal>0?C.green:C.amber],
          ['AUDIO',audioUrl?'YES':'NO',audioUrl?C.green:C.textDim]].map(([k,v,c])=>(
          <div key={k} style={{...card,textAlign:'center',padding:'10px 8px'}}>
            <div style={{fontSize:16,fontFamily:C.mono,color:c,marginBottom:3}}>{v}</div>
            <div style={{fontSize:9,fontFamily:C.mono,color:C.textDim}}>{k}</div>
          </div>
        ))}
      </div>

      {/* ── ENCODING IN PROGRESS ───────────────────────────────────────────── */}
      {(phase==='preparing'||phase==='encoding')&&<div style={{...card,marginBottom:14,padding:20}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
          <Loader size={16} color={C.accent} style={{animation:'spin 1s linear infinite',flexShrink:0}}/>
          <div>
            <div style={{fontSize:12,color:C.textHi,fontWeight:600}}>
              {phase==='preparing'?'Preparing export…':'Encoding…'}
            </div>
            <div style={{fontSize:10,fontFamily:C.mono,color:C.textDim,marginTop:2}}>{phaseMsg}</div>
          </div>
        </div>
        {phase==='encoding'&&<>
          <div style={{height:6,background:C.border,borderRadius:3,overflow:'hidden',marginBottom:8}}>
            <div style={{height:'100%',background:C.accent,borderRadius:3,
              width:`${Math.min(100,frame/Math.max(1,totalDur*24)*100).toFixed(1)}%`,transition:'width 0.5s ease'}}/>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:9,fontFamily:C.mono,color:C.textDim}}>
            <span>Frame {frame.toLocaleString()} / ~{Math.round(totalDur*24).toLocaleString()}</span>
            <span>Elapsed: {fmtTime(elapsed)}</span>
            {elapsed>0&&frame>0&&<span>~{fmtTime(Math.round(elapsed/frame*(totalDur*24-frame)))} remaining</span>}
          </div>
        </>}
      </div>}

      {/* ── DONE ───────────────────────────────────────────────────────────── */}
      {phase==='done'&&<div style={{...card,marginBottom:14,padding:20,border:`1px solid ${C.green}44`,background:C.greenBg}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
          <CircleCheck size={20} color={C.green}/>
          <div>
            <div style={{fontSize:13,color:C.green,fontWeight:700}}>Export complete!</div>
            <div style={{fontSize:10,fontFamily:C.mono,color:C.textDim,marginTop:2}}>
              {outputFile}  ·  {outputSize>0?`${(outputSize/1e6).toFixed(1)} MB`:''}  ·  {fmtTime(elapsed)} encode time
            </div>
          </div>
        </div>
        {/* In-UI video preview (replaces external player) */}
        {playUrl&&<div style={{marginBottom:14,background:'#000',borderRadius:5,overflow:'hidden',border:`1px solid ${C.border}`}}>
          <video key={playUrl} src={playUrl} controls autoPlay
            style={{display:'block',width:'100%',maxHeight:420,background:'#000'}}
            onError={e=>setActionMsg({text:'Playback error — the server may have lost the file',color:C.red})}/>
        </div>}
        <div style={{display:'flex',gap:10}}>
          <Btn onClick={doPlay} disabled={!!actionBusy} style={{flex:1,justifyContent:'center'}}>
            <Play size={13}/>{playUrl?'REPLAY':'PLAY'}
          </Btn>
          <Btn onClick={doSaveAs} disabled={!!actionBusy} style={{flex:1,justifyContent:'center',background:C.blue}}>
            {actionBusy==='save'?<Loader size={13} style={{animation:'spin 1s linear infinite'}}/>:<Save size={13}/>}
            SAVE AS…
          </Btn>
          <button onClick={doDelete} disabled={!!actionBusy}
            style={{background:C.redBg,border:`1px solid ${C.red}44`,borderRadius:5,padding:'8px 14px',fontSize:11,fontFamily:C.mono,fontWeight:700,cursor:actionBusy?'wait':'pointer',color:C.red,display:'flex',alignItems:'center',gap:7,opacity:actionBusy?0.5:1}}>
            {actionBusy==='delete'?<Loader size={13} style={{animation:'spin 1s linear infinite'}}/>:<Trash2 size={13}/>}
            DELETE
          </button>
        </div>
        {actionMsg&&<div style={{fontSize:10,fontFamily:C.mono,color:actionMsg.color,marginTop:10,padding:'6px 8px',background:C.surface,borderRadius:4,border:`1px solid ${actionMsg.color}33`}}>
          {actionMsg.text}
        </div>}
        {!actionMsg&&<div style={{fontSize:9,fontFamily:C.mono,color:C.textDim,marginTop:10}}>
          {playUrl?'Playing inline.':'Click PLAY to preview here.'} Save As… copies the file to your chosen location. Delete removes this session permanently.
        </div>}
      </div>}

      {/* ── ERROR ──────────────────────────────────────────────────────────── */}
      {phase==='error'&&<div style={{...card,marginBottom:14,padding:16,border:`1px solid ${C.red}44`,background:C.redBg}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
          <TriangleAlert size={14} color={C.red}/>
          <span style={{fontSize:12,color:C.red,fontWeight:700}}>Export failed</span>
        </div>
        <div style={{fontSize:10,fontFamily:C.mono,color:C.red,marginBottom:12}}>{errMsg}</div>
        <Btn onClick={()=>setPhase('idle')}>Try Again</Btn>
      </div>}

      {/* ── IDLE — settings + export button ───────────────────────────────── */}
      {phase==='idle'&&<>
        {/* Project settings */}
        <div style={{...card,marginBottom:14}}>
          <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:12,alignItems:'flex-end'}}>
            <div>
              <label style={mkLbl(C)}>Output filename</label>
              <input value={projName} onChange={e=>setProjName(e.target.value.replace(/[^a-zA-Z0-9_\-]/g,'_')||'my_compilation')} style={inp} placeholder="my_compilation"/>
            </div>
            <div>
              <label style={mkLbl(C)}>Quality</label>
              <select value={expQ} onChange={e=>setExpQ(e.target.value)} style={inp}>
                {Object.entries(quals).map(([id,{label}])=><option key={id} value={id}>{label}</option>)}
              </select>
            </div>
          </div>
        </div>
        {/* Audio mix crossfader */}
        <div style={{...card,marginBottom:14,opacity:audioUrl?1:0.45}}>
          <div style={{fontSize:10,fontFamily:C.mono,color:C.textDim,marginBottom:10,letterSpacing:'0.08em'}}>AUDIO MIX</div>
          {/* Level readout row */}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:8}}>
            <div>
              <div style={{fontSize:9,fontFamily:C.mono,color:C.blue,marginBottom:2}}>CLIP AUDIO</div>
              <div style={{fontSize:16,fontFamily:C.mono,color:C.textHi,lineHeight:1}}>{mix<=50?100:Math.round((100-mix)*2)}%</div>
            </div>
            <div style={{fontSize:9,fontFamily:C.mono,color:C.textDim,textAlign:'center'}}>
              {mix===50?'BALANCED':mix<50?'◀ CLIP FAVOURED':'MUSIC FAVOURED ▶'}
            </div>
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:9,fontFamily:C.mono,color:audioUrl?C.amber:C.textDim,marginBottom:2}}>MUSIC</div>
              <div style={{fontSize:16,fontFamily:C.mono,color:audioUrl?C.textHi:C.textDim,lineHeight:1}}>{audioUrl?`${mix<=50?Math.round(mix*2):100}%`:'—'}</div>
            </div>
          </div>
          {/* Single crossfader slider */}
          <input type="range" min={0} max={100} step={1} value={mix}
            disabled={!audioUrl}
            onChange={e=>setMix(Number(e.target.value))}
            style={{
              width:'100%',cursor:audioUrl?'pointer':'default',
              background:`linear-gradient(to right,${C.blue} ${mix}%,${C.amber} ${mix}%)`,
              accentColor: mix<50?C.blue:mix>50?C.amber:'#aaa',
              height:6,borderRadius:3,outline:'none',border:'none',
            }}/>
          {/* Scale labels */}
          <div style={{display:'flex',justifyContent:'space-between',marginTop:5}}>
            <span style={{fontSize:8,fontFamily:C.mono,color:C.blue}}>CLIP ONLY</span>
            <span style={{fontSize:8,fontFamily:C.mono,color:C.textDim}}>50 / 50</span>
            <span style={{fontSize:8,fontFamily:C.mono,color:audioUrl?C.amber:C.textDim}}>MUSIC ONLY</span>
          </div>
        </div>
        {/* Asset readiness */}
        <div style={{...card,marginBottom:14}}>
          <div style={{fontSize:10,fontFamily:C.mono,color:C.textDim,marginBottom:8,letterSpacing:'0.08em'}}>ASSET STATUS</div>
          {usedClips.map(clip=>(
            <div key={clip.id} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 0',borderBottom:`1px solid ${C.border}`}}>
              <Film size={11} color={C.blue}/>
              <div style={{flex:1,fontSize:10,color:C.textHi,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{clip.gwfName||clip.name+'.mp4'}</div>
              <Tag color={clip.gwfName?C.green:C.amber} bg={clip.gwfName?C.greenBg:C.amberBg}>{clip.gwfName?'GWF':'LOCAL'}</Tag>
            </div>
          ))}
          {aiTransitions.map(item=>(
            <div key={item.id} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 0',borderBottom:`1px solid ${C.border}`}}>
              <Sparkles size={11} color={C.accent}/>
              <div style={{flex:1,fontSize:10,color:C.textHi}}>transition_{item.id.slice(0,6)}.mp4</div>
              <Tag color={item.transition.swfSaved?C.green:C.amber} bg={item.transition.swfSaved?C.greenBg:C.amberBg}>
                {item.transition.swfSaved?'SAVED':'WILL UPLOAD'}
              </Tag>
            </div>
          ))}
          {audioUrl&&<div style={{display:'flex',alignItems:'center',gap:8,padding:'5px 0'}}>
            <Music size={11} color={C.amber}/>
            <div style={{flex:1,fontSize:10,color:C.textHi,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{audioName||'audio.mp3'}</div>
            <Tag color={audioSwfSaved?C.green:C.amber} bg={audioSwfSaved?C.greenBg:C.amberBg}>{audioSwfSaved?'SAVED':'WILL UPLOAD'}</Tag>
          </div>}
          {aiTotal>aiDone&&<div style={{fontSize:9,fontFamily:C.mono,color:C.amber,paddingTop:8}}>
            <TriangleAlert size={10} style={{display:'inline',marginRight:5}}/>{aiTotal-aiDone} AI transition(s) not yet generated
          </div>}
        </div>
        {/* Disk space warning */}
        {serveOnline&&diskFreeGb!==null&&diskFreeGb<5&&<div style={{...card,background:C.redBg,border:`1px solid ${C.red}44`,marginBottom:10,padding:'8px 12px',display:'flex',alignItems:'center',gap:8}}>
          <TriangleAlert size={11} color={C.red}/>
          <span style={{fontSize:9,fontFamily:C.mono,color:C.red}}>LOW DISK: only {diskFreeGb.toFixed(1)} GB free — export may fail</span>
        </div>}
        {/* Export button(s) */}
        {serveOnline?(
          <div style={{display:'flex',gap:10,marginBottom:14}}>
            <Btn onClick={startExport} disabled={!canExport} style={{flex:1,justifyContent:'center',padding:'12px 14px'}}>
              <Download size={14}/>EXPORT COMPILATION
            </Btn>
            <button onClick={downloadScriptFallback} title="Download .ps1 script for manual run"
              style={{background:'transparent',border:`1px solid ${C.border}`,borderRadius:5,padding:'8px 12px',cursor:'pointer',color:C.textDim,fontSize:9,fontFamily:C.mono,display:'flex',alignItems:'center',gap:5}}>
              <Download size={11}/>SCRIPT
            </button>
          </div>
        ):(
          <div style={{marginBottom:14}}>
            <div style={{...card,background:C.amberBg,border:`1px solid ${C.amber}44`,marginBottom:10,padding:'10px 12px'}}>
